<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WOW! 7A — منصّة الإنجليزي التفاعلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF5F1; --bg-dot:rgba(47,59,82,.055);
  --card:#FFFFFF; --card2:#F5FAF7;
  --ink:#2F3B52; --muted:#66748A; --line:rgba(47,59,82,.11);
  --sun:#FFD27A; --sun-soft:#FFF4DA;
  --peach:#FFAE96; --peach-soft:#FFEAE3;
  --mint:#7FCDB6; --mint-soft:#DDF3EB;
  --sky:#94C3F0; --sky-soft:#E1EEFC;
  --lilac:#BFAEF0; --lilac-soft:#EEE9FD;
  --gold:#F4C04E; --gold-soft:#FFF2CE;
  --ok:#2F9E78; --ok-soft:#DAF3E8; --no:#D9705E; --no-soft:#FDE5E0;
  --brand:#25896F; --on-brand:#fff; --on-accent:#27324A;
  --sh:0 22px 44px -26px rgba(47,59,82,.35), 0 2px 6px -2px rgba(47,59,82,.08);
  --sh-s:0 10px 24px -18px rgba(47,59,82,.45);
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --r:26px;
  --font:"Baloo Bhaijaan 2","Tajawal","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1B2332; --bg-dot:rgba(255,255,255,.035); --card:#243046; --card2:#2A374F;
  --ink:#EAF0F8; --muted:#A9B5C8; --line:rgba(255,255,255,.10);
  --sun-soft:#3B3526; --peach-soft:#3F2F2D; --mint-soft:#213B38; --sky-soft:#233651; --lilac-soft:#302B4B; --gold-soft:#3A3322;
  --ok:#5CCB9F; --ok-soft:#1E3C33; --no:#F09585; --no-soft:#422C2C; --brand:#4DB896; --on-brand:#10231D;
  --sh:0 22px 44px -26px rgba(0,0,0,.6); --sh-s:0 10px 24px -18px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#1B2332; --bg-dot:rgba(255,255,255,.035); --card:#243046; --card2:#2A374F;
  --ink:#EAF0F8; --muted:#A9B5C8; --line:rgba(255,255,255,.10);
  --sun-soft:#3B3526; --peach-soft:#3F2F2D; --mint-soft:#213B38; --sky-soft:#233651; --lilac-soft:#302B4B; --gold-soft:#3A3322;
  --ok:#5CCB9F; --ok-soft:#1E3C33; --no:#F09585; --no-soft:#422C2C; --brand:#4DB896; --on-brand:#10231D;
  --sh:0 22px 44px -26px rgba(0,0,0,.6); --sh-s:0 10px 24px -18px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:18px;line-height:1.7;color:var(--ink);
  background-color:var(--bg);background-image:radial-gradient(var(--bg-dot) 1.4px,transparent 1.6px);background-size:22px 22px;min-height:100dvh}
img,svg{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:12px}
.en,[dir="ltr"]{font-feature-settings:"kern"}
p{margin:0 0 .4em}
h1,h2,h3,h4{line-height:1.25;margin:0}
.muted{color:var(--muted)}
.lat{unicode-bidi:isolate;direction:ltr;font-weight:600}

/* header */
#hdr{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;margin:10px auto 0;width:min(1080px,calc(100% - 24px));
  display:flex;align-items:center;gap:12px;padding:8px 10px 8px 14px;border-radius:999px;
  background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh-s);border:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.logo .mascot.mini{width:40px;height:40px}
.logo span{display:flex;flex-direction:column;line-height:1.1}
.logo b{font-size:17px;font-weight:800}
.logo small{font-size:12px;color:var(--muted)}
.hnav{display:flex;gap:4px;margin-inline-start:8px}
.hnav a{text-decoration:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:16px;transition:background .3s var(--ease)}
.hnav a:hover{background:var(--card2)}
.htools{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.starpill{background:var(--sun-soft);border-radius:999px;padding:4px 14px;font-weight:700;display:inline-flex;gap:4px;align-items:center}
.starpill.pop{animation:pop .6s var(--spring)}
.ibtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card2);font-size:18px;display:grid;place-items:center;transition:transform .3s var(--spring)}
.ibtn:active{transform:scale(.9)}
@media (max-width:640px){.hnav{display:none}.logo small{display:none}}

main{width:min(1080px,calc(100% - 24px));margin:0 auto;padding:18px 0 70px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;border:0;text-decoration:none;font-weight:700;font-size:18px;
  padding:10px 12px 10px 22px;border-radius:999px;transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .3s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--on-brand);box-shadow:0 12px 24px -14px var(--brand)}
.btn.primary .bi{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-style:normal;transition:transform .4s var(--ease)}
.btn.primary:hover .bi{transform:translateX(-4px) scale(1.06)}
.btn.soft{background:var(--card);box-shadow:var(--sh-s);padding:12px 22px;border:1px solid var(--line)}
.btn.soft:hover{background:var(--card2)}
.btn.tiny{font-size:15px;padding:6px 14px}
.spk{border:0;background:var(--cs,var(--card2));width:34px;height:34px;border-radius:50%;font-size:15px;display:inline-grid;place-items:center;vertical-align:middle;flex:0 0 auto;transition:transform .3s var(--spring)}
.spk:hover{transform:scale(1.1)}
.spk.speaking{animation:pulse .7s var(--ease)}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr .75fr;align-items:center;gap:20px;padding:28px 8px 10px}
.hello{font-size:20px;font-weight:600;color:var(--muted);margin:0}
.hero h1{font-size:clamp(34px,5.4vw,60px);font-weight:800;letter-spacing:-.01em;margin:4px 0 10px;text-wrap:balance}
.lead{font-size:22px;font-weight:700;color:var(--brand);margin:0}
.lead2{color:var(--muted);max-width:44ch;margin:.3em 0 1em}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px}
.hero-art{position:relative;display:grid;place-items:center}
.hero-art .mascot{width:min(260px,70vw)}
.bubble{position:absolute;top:6%;left:0;background:var(--card);padding:6px 14px;border-radius:18px 18px 18px 4px;font-weight:700;box-shadow:var(--sh-s);font-size:16px}
.mascot .bob{animation:bob 3.4s var(--ease) infinite alternate;transform-origin:110px 200px}
.mascot .wave{animation:wave 1.6s var(--ease) infinite alternate;transform-origin:186px 118px}
.mascot.mini .bob,.mascot.mini .wave{animation:none}
@media (max-width:760px){.hero{grid-template-columns:1fr;text-align:center;padding-top:14px}.hero-art{order:-1}.hero-art .mascot{width:170px}.hero-cta{justify-content:center}.lead2{margin-inline:auto}.bubble{left:auto;right:8%}}

/* chips */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 10px}
.chip{background:var(--card);border-radius:22px;padding:12px 16px;box-shadow:var(--sh-s);display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center}
.chip>span{grid-row:span 2;font-size:28px}
.chip b{font-size:24px;font-weight:800;line-height:1.1}
.chip b small{font-size:15px;color:var(--muted);font-weight:600}
.chip em{font-style:normal;color:var(--muted);font-size:15px}
@media (max-width:560px){.chips{grid-template-columns:1fr 1fr 1fr;gap:8px}.chip{grid-template-columns:1fr;text-align:center;padding:10px 6px}.chip>span{grid-row:auto;font-size:22px}.chip b{font-size:19px}.chip em{font-size:13px}}

/* map */
.mapsec{margin-top:38px}
.mapsec h2{font-size:clamp(28px,4vw,40px);font-weight:800}
.sub{color:var(--muted);margin:.2em 0 1em}
.map{position:relative;max-width:760px;margin:10px auto 0}
.stop{display:flex;align-items:center;gap:16px;text-decoration:none;position:relative;z-index:1}
.stop.s-l{padding-left:calc(25% - 58px)}
.stop.s-r{flex-direction:row-reverse;padding-right:calc(25% - 58px)}
.island{flex:0 0 116px;height:116px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);padding:7px;box-shadow:var(--sh);transition:transform .5s var(--spring)}
.island .em{width:100%;height:100%;border-radius:50%;background:var(--cs);display:grid;place-items:center;font-size:48px;box-shadow:inset 0 -6px 0 rgba(47,59,82,.06)}
.stop:hover .island{transform:translateY(-4px) rotate(-3deg) scale(1.04)}
.label{background:var(--card);border-radius:20px;padding:10px 16px;box-shadow:var(--sh-s);display:flex;flex-direction:column;line-height:1.3;min-width:0;border:1px solid var(--line)}
.label b{font-size:18px;font-weight:800;text-align:end}
.label span{font-weight:600}
.label small{color:var(--muted);font-size:14px}
.trail{display:block;width:100%;height:64px;margin:-8px 0}
.trail path{fill:none;stroke:var(--muted);stroke-width:3;stroke-dasharray:2 10;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.55}
@media (max-width:560px){.island{flex-basis:92px;height:92px}.island .em{font-size:38px}.stop.s-l{padding-left:calc(25% - 46px)}.stop.s-r{padding-right:calc(25% - 46px)}.label b{font-size:16px}}
.foot{text-align:center;color:var(--muted);font-size:14px;margin-top:40px}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;margin:4px 0 14px;font-size:16px;color:var(--muted)}
.crumbs a{text-decoration:none;display:inline-flex;align-items:center;gap:4px;padding:4px 12px;background:var(--card);border-radius:999px;box-shadow:var(--sh-s);color:var(--ink);font-weight:600}

/* unit hero */
.unit-hero{display:grid;grid-template-columns:auto 1fr;gap:22px;background:var(--cs);border-radius:34px;padding:28px;position:relative;overflow:hidden}
.unit-hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:var(--c);opacity:.35;left:-80px;bottom:-120px}
.uh-em{font-size:74px;width:124px;height:124px;display:grid;place-items:center;background:var(--card);border-radius:36px;box-shadow:var(--sh);transform:rotate(-4deg)}
.uh-txt{position:relative;z-index:1}
.uh-txt small{font-weight:700;color:var(--muted)}
.unit-hero h1{font-size:clamp(28px,4.5vw,44px);font-weight:800;display:flex;flex-wrap:wrap;gap:.2em .5em;align-items:baseline}
.unit-hero h1 .ar{font-size:.7em;font-weight:600;color:var(--muted)}
.gl{margin:.6em 0 .2em;font-weight:700}
.unit-hero ul{margin:0 0 12px;padding-inline-start:22px}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--brand));transform-origin:right;transition:transform 1s var(--ease)}
.barlbl{font-size:15px;color:var(--muted);margin-top:4px}
@media (max-width:600px){.unit-hero{grid-template-columns:1fr;padding:22px}.uh-em{width:96px;height:96px;font-size:56px}}

/* lesson cards */
.lessons{display:grid;gap:12px;margin-top:20px}
.lcard,.review{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:24px;padding:12px 16px;text-decoration:none;box-shadow:var(--sh-s);border:1px solid var(--line);transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.lcard:hover,.review:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.num{width:34px;height:34px;border-radius:50%;background:var(--c);color:var(--on-accent);font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.lic{font-size:34px;width:58px;height:58px;display:grid;place-items:center;background:var(--cs);border-radius:18px;flex:0 0 auto}
.lt{display:flex;flex-direction:column;min-width:0;flex:1}
.lt b{font-size:19px;text-align:end;font-weight:700}
.lt span{color:var(--muted);font-size:16px}
.lmeta{display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
.st{color:#E7A92B;letter-spacing:2px;font-size:20px}
.lmeta small{color:var(--muted);font-size:14px}
.review{background:var(--cs);border-style:dashed;border-color:var(--c)}
.review>span:first-child{font-size:30px}
.review>span:nth-child(2){display:flex;flex-direction:column;flex:1}
.review small{color:var(--muted)}
.review .bi{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal}
@media (max-width:520px){.num{display:none}.lic{width:48px;height:48px;font-size:28px}.lt b{font-size:17px}}

/* lesson head + tabs */
.lhead{display:flex;align-items:center;gap:16px;background:var(--cs);border-radius:30px;padding:18px 22px}
.lh-ic{font-size:46px;width:78px;height:78px;display:grid;place-items:center;background:var(--card);border-radius:24px;box-shadow:var(--sh-s);flex:0 0 auto;transform:rotate(-4deg)}
.lhead small{font-weight:700;color:var(--muted)}
.lhead h1{font-size:clamp(22px,3.6vw,34px);font-weight:800;text-align:end}
.lhead div{flex:1;min-width:0}
.lhead p{margin:0;color:var(--muted);font-weight:600}
.lh-st{color:#E7A92B;font-size:24px;letter-spacing:2px}
@media (max-width:560px){.lh-st{display:none}.lh-ic{width:62px;height:62px;font-size:36px}}
.tabs{display:flex;gap:6px;background:var(--card);padding:6px;border-radius:999px;margin:16px 0 18px;box-shadow:var(--sh-s);position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);z-index:10}
.tab{flex:1;text-align:center;text-decoration:none;padding:8px 6px;border-radius:999px;font-weight:700;display:flex;gap:6px;justify-content:center;align-items:center;transition:background .4s var(--ease),color .3s}
.tab.on{background:var(--c);color:var(--on-accent)}
.tab span{font-size:20px}

/* learn */
.langsw{display:inline-flex;gap:4px;background:var(--card);padding:4px;border-radius:999px;box-shadow:var(--sh-s);margin-bottom:14px}
.langsw button{border:0;background:none;padding:4px 14px;border-radius:999px;font-weight:600;font-size:15px}
.langsw button.on{background:var(--cs);box-shadow:inset 0 0 0 2px var(--c)}
.lang-ar .en-block{display:none}.lang-en .ar-block{display:none}
.card{background:var(--card);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh-s);border:1px solid var(--line)}
.intro{border-inline-start:8px solid var(--c)}
.intro .ar-block p{font-size:19px}
.en-block{background:var(--card2);border-radius:18px;padding:12px 16px;margin-top:10px;font-weight:500;line-height:1.6}
.en-block p{display:inline}
.en-block p+p::before{content:"";display:block;height:.4em}
.ar-block.muted p{font-size:16px}
.extra .ar-block{margin-top:10px}
.sec{font-size:22px;font-weight:800;margin:26px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec small{font-size:14px;color:var(--muted);font-weight:500}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.word{border:0;background:var(--card);border-radius:22px;padding:14px 10px;box-shadow:var(--sh-s);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;transition:transform .45s var(--spring),background .3s}
.word:hover{transform:translateY(-4px) rotate(-1.5deg);background:var(--cs)}
.word.speaking{background:var(--cs)}
.we{font-size:40px;line-height:1.2}
.word b{font-size:18px;font-weight:800}
.wa{color:var(--muted);font-size:15px;font-weight:600}
.word small{font-size:13px;color:var(--muted);line-height:1.4;margin-top:4px}
.rule .rt{font-weight:800;font-size:18px;margin-bottom:10px;text-align:end}
.tbl{overflow-x:auto;border-radius:16px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:16px}
th{background:var(--cs);padding:8px 12px;font-weight:700}
td{padding:9px 12px;border-top:1px solid var(--line)}
tbody tr:nth-child(even) td{background:var(--card2)}
.note{display:flex;gap:10px;margin-top:12px;background:var(--card2);border-radius:16px;padding:10px 14px}
.note p{margin:0}
.note .en{font-weight:600}
.exs,.phr{display:grid;gap:8px}
.ex,.ph{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 16px;box-shadow:var(--sh-s);border:1px solid var(--line)}
.ex>div{flex:1}
.ph{box-shadow:none;background:var(--card2);display:grid;grid-template-columns:1fr auto;align-items:center}
.ph .ar{grid-column:1;color:var(--muted);font-size:15px}
.ph .spk{grid-row:1/span 2;grid-column:2}
.ex .en,.ph .en{font-weight:700;margin:0;text-align:end}
.ex .ar{margin:0;color:var(--muted);font-size:15px}
.extra{margin-top:16px}
.extra h4{font-size:20px;font-weight:800;margin-bottom:10px}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--sun-soft);border-radius:22px;padding:14px 18px;margin-top:18px;border:2px dashed var(--sun)}
.tip span{font-size:26px}.tip p{margin:0;font-weight:600}
.nextrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}

/* games list */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gcard{border:0;background:var(--card);border-radius:26px;padding:18px;box-shadow:var(--sh-s);display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;transition:transform .45s var(--spring)}
.gcard:hover{transform:translateY(-4px) rotate(1deg)}
.gcard .gi{font-size:36px;width:62px;height:62px;border-radius:20px;background:var(--cs);display:grid;place-items:center;margin-bottom:6px}
.gcard b{font-size:20px}
.gcard small{color:var(--muted);font-size:14px;line-height:1.4}
.gcard .gs{margin-top:6px;color:#E7A92B;font-weight:700}
.gcard.off{opacity:.5;cursor:not-allowed}

/* game shell */
.game{padding:16px 18px 22px}
.ghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gtitle{display:flex;align-items:center;gap:8px;flex:1;justify-content:center;font-size:20px}
.gtitle span{font-size:26px}
.gprog{background:var(--cs);border-radius:999px;padding:2px 12px;font-weight:700;font-size:15px;min-width:64px;text-align:center}
.ginst{text-align:center;color:var(--muted);margin:10px 0 16px;font-size:16px}
.gbody{min-height:260px}

.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:grid;gap:8px;align-content:start}
.tile{border:2px solid var(--line);background:var(--card2);border-radius:18px;padding:10px 12px;font-weight:700;font-size:17px;min-height:54px;transition:transform .35s var(--spring),background .3s,border-color .3s,opacity .4s}
.tile.sel{border-color:var(--c);background:var(--cs);transform:scale(1.03)}
.tile.done{background:var(--ok-soft);border-color:var(--ok);opacity:.55;transform:scale(.97)}

.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:560px;margin:0 auto;perspective:900px}
@media (max-width:520px){.memory{grid-template-columns:repeat(3,1fr)}}
.mcard{border:0;padding:0;background:none;aspect-ratio:1/1;position:relative;transform-style:preserve-3d;transition:transform .55s var(--ease)}
.mcard.open{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-weight:800;padding:6px;text-align:center;line-height:1.2}
.face.back{background:var(--c);color:var(--on-accent);font-size:30px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.face.front{background:var(--card2);border:2px solid var(--line);transform:rotateY(180deg);font-size:16px}
.face.front.emo{font-size:42px}
.mcard.done .front{background:var(--ok-soft);border-color:var(--ok)}

.listen{display:grid;gap:18px;justify-items:center}
.bigspk{width:110px;height:110px;border-radius:50%;border:0;background:var(--c);font-size:46px;box-shadow:var(--sh);transition:transform .4s var(--spring)}
.bigspk:active{transform:scale(.92)}
.lopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:560px}
.lopt{border:2px solid var(--line);background:var(--card2);border-radius:20px;padding:12px;display:flex;align-items:center;gap:10px;font-size:17px;transition:transform .3s var(--spring)}
.lopt span{font-size:30px}
.lopt.ok{background:var(--ok-soft);border-color:var(--ok)}
.lopt.no{background:var(--no-soft);border-color:var(--no);opacity:.6}

.scr{display:grid;gap:16px;justify-items:center}
.scr-hint{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;background:var(--cs);border-radius:20px;padding:8px 18px}
.se{font-size:42px}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:6px;border-radius:18px;transition:background .3s}
.slots.ok{background:var(--ok-soft)}
.slot{width:40px;height:48px;border-radius:12px;border:2px dashed var(--muted);display:grid;place-items:center;font-size:24px;font-weight:800}
.slot.f{border-style:solid;border-color:var(--c);background:var(--cs);animation:pop .35s var(--spring)}
.fixed{width:18px;display:grid;place-items:center;font-size:24px;font-weight:800}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.let{width:48px;height:52px;border-radius:14px;border:0;background:var(--c);color:var(--on-accent);font-size:24px;font-weight:800;box-shadow:inset 0 -5px 0 rgba(0,0,0,.1);transition:transform .3s var(--spring),opacity .3s}
.let:active{transform:scale(.9)}
.let.used{opacity:.18;pointer-events:none}
.scr-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.sort{display:grid;gap:18px}
.scard{min-height:110px;background:var(--cs);border-radius:24px;padding:18px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center;font-size:21px;font-weight:700;border:2px solid var(--c)}
.scard.in{animation:cardIn .5s var(--spring)}
.scard.out{transform:translateY(20px) scale(.92);opacity:.25;transition:transform .45s var(--ease),opacity .45s var(--ease)}
.buckets{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px}
.bucket{border:0;background:var(--card2);border-radius:22px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:18px;border-bottom:6px solid var(--line);transition:transform .35s var(--spring),background .3s}
.bucket small{font-size:14px;color:var(--muted)}
.bucket.hit{background:var(--ok-soft);transform:scale(1.05)}
.bucket.hint{background:var(--ok-soft);outline:3px solid var(--ok)}
@media (max-width:480px){.buckets{grid-template-columns:1fr}.scard{font-size:18px}}

.build{display:grid;gap:14px}
.bhint{text-align:center;font-weight:700;background:var(--cs);border-radius:16px;padding:8px 14px;margin:0}
.answer{min-height:70px;border-radius:20px;border:2px dashed var(--c);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;transition:background .3s}
.answer.ok{background:var(--ok-soft);border-style:solid;border-color:var(--ok)}
.ph0{color:var(--muted);font-size:15px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{border:0;background:var(--card2);border-radius:14px;padding:8px 14px;font-size:18px;font-weight:700;box-shadow:inset 0 -4px 0 var(--line);transition:transform .3s var(--spring),opacity .3s}
.tok.in{background:var(--c);color:var(--on-accent);animation:pop .3s var(--spring)}
.tok.used{opacity:.2;pointer-events:none}

.fill{display:grid;gap:16px}
.timer{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--no),var(--sun),var(--ok));transform-origin:left}
.combo{text-align:center;font-weight:800;color:#E08A2B;min-height:1.5em}
.fq{font-size:24px;font-weight:700;text-align:center;background:var(--cs);border-radius:22px;padding:22px 16px}
.fopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fopt{border:2px solid var(--line);background:var(--card2);border-radius:20px;padding:14px;font-size:20px;font-weight:800;transition:transform .3s var(--spring)}
.fopt.ok{background:var(--ok-soft);border-color:var(--ok)}
.fopt.no{background:var(--no-soft);border-color:var(--no)}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--c);color:var(--muted);text-align:center;margin:0 4px}
.blank.filled{color:var(--ok);border-color:var(--ok);min-width:0;padding:0 4px}

.win,.result{text-align:center}
.winst{font-size:54px;color:#E7A92B;letter-spacing:6px;animation:pop .7s var(--spring)}
.win h3,.result h3{font-size:26px;font-weight:800;margin:6px 0}

/* quiz */
.quiz{padding:20px 22px}
.qtop{display:grid;gap:6px;font-weight:700;color:var(--muted);font-size:15px}
.qq{font-size:clamp(21px,3vw,27px);font-weight:800;margin:18px 0 6px;text-align:center;line-height:1.5}
.qh{text-align:center;color:var(--muted)}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{border:2px solid var(--line);background:var(--card2);border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;text-align:start;transition:transform .3s var(--spring),background .3s,border-color .3s}
.opt:hover{border-color:var(--c)}
.opt .ol{width:34px;height:34px;border-radius:50%;background:var(--cs);display:grid;place-items:center;flex:0 0 auto;font-size:16px}
.opt.picked{border-color:var(--c);background:var(--cs)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.no{border-color:var(--no);background:var(--no-soft)}
.fbbox{margin-top:16px;border-radius:20px;padding:14px 18px;text-align:center;animation:cardIn .45s var(--spring)}
.fbbox.good{background:var(--ok-soft)}.fbbox.bad{background:var(--no-soft)}
.fbbox b{font-size:21px;display:block}
.fbbox .btn{margin-top:8px}
.passage{background:var(--card2);border-radius:18px;padding:10px 16px;margin-top:12px}
.passage summary{cursor:pointer;font-weight:700}
.passage p{margin:.6em 0;font-size:17px;line-height:1.7}
.qintro{text-align:center;max-width:560px;margin:0 auto}
.qintro .big{font-size:56px;display:block}
.qintro h3{font-size:26px;font-weight:800}
.rules{text-align:start;margin:12px 0 16px;padding-inline-start:22px}
.mist{text-align:start;margin-top:16px;background:var(--card2);border-radius:18px;padding:10px 16px}
.mist summary{cursor:pointer;font-weight:800}
.mi{border-top:1px solid var(--line);padding:10px 0}
.mi .en{font-weight:700;text-align:end}
.mi .x{color:var(--no);font-weight:700}.mi .v{color:var(--ok);font-weight:700;margin-inline-start:10px}
.mi a{font-weight:700;color:var(--brand)}
.score{width:150px;height:150px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0);padding:12px}
.score span{width:100%;height:100%;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:38px;font-weight:800}
.urows{display:grid;gap:10px;margin:18px 0;text-align:start}
.urow{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:10px;align-items:center}
.urow b{margin-inline-end:6px}
.urow em{font-style:normal;font-weight:800}
@media (max-width:520px){.urow{grid-template-columns:1fr auto}.urow .bar{grid-column:1/-1;grid-row:2}}
.weak{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.weak a{display:inline-flex;gap:6px;align-items:center;text-decoration:none;background:var(--cs);border-radius:999px;padding:6px 14px;font-weight:700;font-size:16px}

/* confetti + motion */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:10px;height:15px;border-radius:3px;animation:fall 1.6s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-10px)}}
@keyframes wave{from{transform:rotate(0)}to{transform:rotate(-14deg)}}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.25)}}
@keyframes cardIn{from{transform:translateY(18px) scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.shake{animation:shake .42s var(--ease)}
#app>*{animation:cardIn .6s var(--ease) both}
#app>*:nth-child(2){animation-delay:.06s}#app>*:nth-child(3){animation-delay:.12s}#app>*:nth-child(4){animation-delay:.18s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

function gameShell(st, L, gi, inner) {
  const g = L.games[gi], m = GAME_META[g.type];
  st.innerHTML = `<div class="game card">

  $("#gBack").onclick = () => { stopAll(); playTab(st, L); };

const setProg = t => { const p = $("#gProg"); if (p) p.textContent = t; };

function gameWin(st, L, gi, miss) {
  stopAll();
  const s = miss === 0 ? 3 : miss <= 2 ? 2 : 1, k = L.id + ":" + gi;
  P.games[k] = Math.max(P.games[k] || 0, s); save();
  sfx.win(); if (s >= 2) confetti();
  const msgs = ["", "أحسنت! جرّب مرة ثانية لتجمع نجوماً أكثر 💪", "رائع جداً! 🌟", "ممتاز! بدون ولا خطأ 🏅"];
  const body = $(".gbody", st);
  body.innerHTML = `<div class="win"><div class="winst">${starStr(s)}</div><h3>${msgs[s]}</h3><p>${miss ? `أخطاؤك: ${miss}` : "كل إجاباتك صحيحة!"}</p>
    <div class="nextrow"><button class="btn primary" id="again"><span>العب مرة ثانية</span><i class="bi">🔄</i></button><button class="btn soft" id="other">🎮 لعبة أخرى</button><a class="btn soft" href="#/l/${L.id}/quiz">📝 الاختبار</a></div></div>`;
  $("#again").onclick = () => startGame(st, L, gi);
  $("#other").onclick = () => playTab(st, L);
}

function startGame(st, L, gi) {
  stopAll();
  const g = L.games[gi];
  ({ match: gMatch, memory: gMemory, listen: gListen, scramble: gScramble, sort: gSort, build: gBuild, fill: gFill })[g.type](st, L, gi, g);
  st.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" });
}

/* --- match --- */
function gMatch(st, L, gi, g) {
  let pairs = g.pairs ? g.pairs.map(p => [p[0], p[1], isAr(p[0]) ? "" : p[0].replace(/^[^A-Za-z0-9]+/, "")])
    : L.words.map(w => [w[2] + " " + w[0], w[1], w[0]]);
  pairs = shuffle(pairs).slice(0, 6);
  const left = shuffle(pairs.map((p, i) => ({ i, t: p[0], s: p[2] }))), right = shuffle(pairs.map((p, i) => ({ i, t: p[1], s: isAr(p[1]) ? "" : p[1] })));
  const tile = (x, side) => `<button class="tile" data-side="${side}" data-i="${x.i}" dir="${dirOf(x.t)}" ${x.s ? `data-s="${esc(x.s)}"` : ""}>${esc(x.t)}</button>`;
  gameShell(st, L, gi, `<div class="match"><div class="col">${left.map(x => tile(x, "l")).join("")}</div><div class="col">${right.map(x => tile(x, "r")).join("")}</div></div>`);
  let sel = null, got = 0, miss = 0;
  setProg(`0 / ${pairs.length}`);
  $$(".tile", st).forEach(b => b.onclick = () => {
    if (b.classList.contains("done")) return;
    if (b.dataset.s) say(b.dataset.s);
    if (!sel || sel.dataset.side === b.dataset.side) {
      if (sel) sel.classList.remove("sel");
      sel = sel === b ? null : b; if (sel) { sel.classList.add("sel"); sfx.tap(); } return;
    }
    if (sel.dataset.i === b.dataset.i) {
      [sel, b].forEach(x => { x.classList.remove("sel"); x.classList.add("done"); });
      sfx.ok(); got++; setProg(`${got} / ${pairs.length}`); sel = null;
      if (got === pairs.length) later(() => gameWin(st, L, gi, miss), 600);
    } else { miss++; sfx.no(); shake(b); shake(sel); sel.classList.remove("sel"); sel = null; }
  });
}

/* --- memory --- */
function gMemory(st, L, gi) {
  const ws = shuffle(L.words).slice(0, 6);
  const cards = shuffle(ws.flatMap((w, i) => [{ i, f: w[2], e: 1, w: w[0] }, { i, f: w[0], e: 0, w: w[0] }]));
  gameShell(st, L, gi, `<div class="memory">${cards.map((c, k) => `<button class="mcard" data-k="${k}" aria-label="بطاقة"><span class="face back">?</span><span class="face front ${c.e ? "emo" : ""}" dir="ltr">${esc(c.f)}</span></button>`).join("")}</div>`);
  let open = [], got = 0, miss = 0, lock = false;
  setProg(`0 / ${ws.length}`);
  $$(".mcard", st).forEach(b => b.onclick = () => {
    if (lock || b.classList.contains("open")) return;
    const c = cards[+b.dataset.k]; b.classList.add("open"); open.push([b, c]); sfx.tap();
    if (!c.e) say(c.w);
    if (open.length === 2) {
      const [[b1, c1], [b2, c2]] = open; open = [];
      if (c1.i === c2.i) {
        got++; setProg(`${got} / ${ws.length}`); later(() => { b1.classList.add("done"); b2.classList.add("done"); sfx.ok(); say(c1.w); }, 250);
        if (got === ws.length) later(() => gameWin(st, L, gi, Math.max(0, miss - 3)), 1100);
      } else { miss++; lock = true; later(() => { b1.classList.remove("open"); b2.classList.remove("open"); lock = false; }, 850); }
    }
  });
}

/* --- listen --- */
function gListen(st, L, gi) {
  const rounds = shuffle(L.words).slice(0, 8);
  let r = 0, miss = 0;
  gameShell(st, L, gi, `<div class="listen"><button class="bigspk" id="lsBtn" aria-label="استمع">🔊</button><div class="lopts" id="lOpts"></div></div>`);
  const round = () => {
    const w = rounds[r];
    const opts = shuffle([w, ...shuffle(L.words.filter(x => x !== w)).slice(0, 3)]);
    setProg(`${r + 1} / ${rounds.length}`);
    $("#lOpts").innerHTML = opts.map(o => `<button class="lopt" data-w="${esc(o[0])}"><span>${o[2]}</span><b dir="ltr">${esc(o[0])}</b></button>`).join("");
    $("#lsBtn").onclick = () => say(w[0]);
    later(() => say(w[0]), 250);
    let wrongHere = false;
    $$(".lopt", st).forEach(b => b.onclick = () => {
      if (b.dataset.w === w[0]) {
        b.classList.add("ok"); sfx.ok(); if (wrongHere) miss++;
        r++; later(() => r < rounds.length ? round() : gameWin(st, L, gi, miss), 650);
        $$(".lopt", st).forEach(x => x.onclick = null);
      } else { wrongHere = true; b.classList.add("no"); sfx.no(); shake(b); later(() => say(w[0]), 400); }
    });
  };
  round();
}

/* --- scramble --- */
function gScramble(st, L, gi) {
  const words = shuffle(L.words).slice(0, 6);
  let r = 0, miss = 0;
  gameShell(st, L, gi, `<div class="scr"><div class="scr-hint" id="sHint"></div><div class="slots" id="slots" dir="ltr"></div><div class="letters" id="letters" dir="ltr"></div>
    <div class="scr-tools"><button class="btn tiny soft" id="sDel">⌫ امسح حرف</button><button class="btn tiny soft" id="sClr">مسح الكل</button><button class="btn tiny soft" id="sHelp">💡 ساعدني</button></div></div>`);
  const round = () => {
    const w = words[r], chars = [...w[0]];
    setProg(`${r + 1} / ${words.length}`);
    $("#sHint").innerHTML = `<span class="se">${w[2]}</span><span>${esc(w[1])}</span>`;
    const letterIdx = chars.map((c, i) => /[A-Za-z]/.test(c) ? i : -1).filter(i => i >= 0);
    let tiles = shuffle(letterIdx.map(i => chars[i]));
    if (tiles.join("") === letterIdx.map(i => chars[i]).join("") && tiles.length > 2) tiles = tiles.reverse();
    let filled = [];
    $("#slots").innerHTML = chars.map((c, i) => /[A-Za-z]/.test(c) ? `<span class="slot" data-i="${i}"></span>` : `<span class="fixed">${c === " " ? "&nbsp;" : esc(c)}</span>`).join("");
    $("#letters").innerHTML = tiles.map((c, k) => `<button class="let" data-k="${k}">${esc(c)}</button>`).join("");
    const slots = $$(".slot", st);
    const paint = () => { slots.forEach((s, j) => { s.textContent = filled[j] ? filled[j].c : ""; s.classList.toggle("f", !!filled[j]); }); };
    const check = () => {
      if (filled.length < slots.length) return;
      const guess = filled.map(f => f.c).join(""), target = letterIdx.map(i => chars[i]).join("");
      if (guess.toLowerCase() === target.toLowerCase()) {
        $("#slots").classList.add("ok"); sfx.ok(); say(w[0]);
        r++; later(() => { $("#slots").classList.remove("ok"); r < words.length ? round() : gameWin(st, L, gi, miss); }, 900);
      } else { miss++; sfx.no(); shake($("#slots")); later(() => { filled.forEach(f => f.b.classList.remove("used")); filled = []; paint(); }, 600); }
    };
    $$(".let", st).forEach(b => b.onclick = () => {
      if (b.classList.contains("used") || filled.length >= slots.length) return;
      b.classList.add("used"); filled.push({ c: b.textContent, b }); sfx.tap(); paint(); check();
    });
    $("#sDel").onclick = () => { const f = filled.pop(); if (f) f.b.classList.remove("used"); paint(); };
    $("#sClr").onclick = () => { filled.forEach(f => f.b.classList.remove("used")); filled = []; paint(); };
    $("#sHelp").onclick = () => {
      // put the correct next letter
      filled.forEach(f => f.b.classList.remove("used"));
      const target = letterIdx.map(i => chars[i]); const keep = [];
      for (let j = 0; j < filled.length && filled[j].c === target[j]; j++) keep.push(filled[j].c);
      filled = [];
      const need = [...keep, target[keep.length]].filter(Boolean);
      need.forEach(c => { const b = $$(".let", st).find(x => !x.classList.contains("used") && x.textContent === c); if (b) { b.classList.add("used"); filled.push({ c, b }); } });
      miss++; paint(); check();
    };
  };
  round();
}

/* --- sort --- */
function gSort(st, L, gi, g) {
  const items = shuffle(g.items);
  let r = 0, miss = 0; const counts = g.buckets.map(() => 0);
  gameShell(st, L, gi, `<div class="sort"><div class="scard" id="sCard" dir="ltr"></div>
    <div class="buckets" style="--n:${g.buckets.length}">${g.buckets.map((b, i) => `<button class="bucket" data-b="${i}" dir="${dirOf(b)}"><b>${esc(b)}</b><small id="bc${i}">0</small></button>`).join("")}</div></div>`);
  const show = () => {
    const it = items[r]; setProg(`${r + 1} / ${items.length}`);
    const c = $("#sCard"); c.className = "scard in"; c.innerHTML = `${blank(it[0])} ${spk(it[0].replace(/_{3,}/g, "..."))}`;
  };
  $$(".bucket", st).forEach(b => b.onclick = () => {
    const it = items[r]; if (!it || b.classList.contains("wait")) return;
    const ok = +b.dataset.b === it[1];
    const right = $(`.bucket[data-b="${it[1]}"]`, st);
    if (ok) { sfx.ok(); b.classList.add("hit"); } else { miss++; sfx.no(); shake(b); right.classList.add("hint"); }
    counts[it[1]]++; $("#bc" + it[1]).textContent = counts[it[1]];
    $$(".bucket", st).forEach(x => x.classList.add("wait"));
    $("#sCard").className = "scard out";
    later(() => { $$(".bucket", st).forEach(x => x.classList.remove("hit", "hint", "wait")); r++; r < items.length ? show() : gameWin(st, L, gi, miss); }, ok ? 550 : 1100);
  });
  show();
}

/* --- build --- */
function gBuild(st, L, gi, g) {
  const items = shuffle(g.items).slice(0, 4);
  let r = 0, miss = 0;
  gameShell(st, L, gi, `<div class="build"><p class="bhint" id="bHint"></p><div class="answer" id="bAns" dir="ltr"></div><div class="bank" id="bBank" dir="ltr"></div>
  <div class="scr-tools"><button class="btn tiny soft" id="bClr">مسح</button></div></div>`);
  const round = () => {
    const [sent, ar] = items[r]; const toks = sent.split(" ");
    let order = shuffle(toks.map((t, i) => i)); if (order.every((v, i) => v === i) && order.length > 1) order.reverse();
    setProg(`${r + 1} / ${items.length}`);
    $("#bHint").innerHTML = "المعنى: " + bidi(ar);
    const ans = [];
    const paint = () => {
      $("#bAns").innerHTML = ans.length ? ans.map((k, j) => `<button class="tok in" data-j="${j}">${esc(toks[k])}</button>`).join("") : `<span class="ph0">اضغط الكلمات هنا بالترتيب…</span>`;
      $("#bBank").innerHTML = order.map(k => `<button class="tok ${ans.includes(k) ? "used" : ""}" data-k="${k}">${esc(toks[k])}</button>`).join("");
      $$("#bBank .tok", st).forEach(b => b.onclick = () => { const k = +b.dataset.k; if (ans.includes(k)) return; ans.push(k); sfx.tap(); paint(); check(); });
      $$("#bAns .tok", st).forEach(b => b.onclick = () => { ans.splice(+b.dataset.j, 1); paint(); });
    };
    const check = () => {
      if (ans.length < toks.length) return;
      const guess = ans.map(k => toks[k]).join(" ");
      if (guess === sent) { $("#bAns").classList.add("ok"); sfx.ok(); say(sent); r++; later(() => { $("#bAns").classList.remove("ok"); r < items.length ? round() : gameWin(st, L, gi, miss); }, 1300); }
      else { miss++; sfx.no(); shake($("#bAns")); later(() => { ans.length = 0; paint(); }, 700); }
    };
    $("#bClr").onclick = () => { ans.length = 0; paint(); };
    paint();
  };
  round();
}

/* --- fill (speed) --- */
function gFill(st, L, gi, g) {
  const items = shuffle(g.items); const T = 12000;
  let r = 0, miss = 0, combo = 0;
  gameShell(st, L, gi, `<div class="fill"><div class="timer"><i id="tBar"></i></div><div class="combo" id="combo"></div><div class="fq" id="fQ" dir="ltr"></div><div class="fopts" id="fOpts"></div></div>`);
  const round = () => {
    const [s, o, a] = items[r]; setProg(`${r + 1} / ${items.length}`);
    $("#fQ").innerHTML = blank(s);
    const ord = shuffle(o.map((_, i) => i));
    $("#fOpts").innerHTML = ord.map(i => `<button class="fopt" data-i="${i}" dir="${dirOf(o[i])}">${esc(o[i])}</button>`).join("");
    const bar = $("#tBar"); bar.style.transition = "none"; bar.style.transform = "scaleX(1)"; void bar.offsetWidth;
    bar.style.transition = `transform ${T}ms linear`; bar.style.transform = "scaleX(0)";
    let done = false;
    const finish = (ok, b) => {
      if (done) return; done = true; TIMERS.forEach(clearTimeout); TIMERS = [];
      bar.style.transition = "none";
      const right = $(`.fopt[data-i="${a}"]`, st); right.classList.add("ok");
      if (ok) { combo++; sfx.ok(); } else { combo = 0; miss++; sfx.no(); if (b) { b.classList.add("no"); shake(b); } }
      $("#combo").textContent = combo >= 2 ? `🔥 ${combo} متتالية!` : "";
      $("#fQ").innerHTML = esc(s).replace(/_{3,}/g, `<span class="blank filled">${esc(o[a])}</span>`);
      r++; later(() => r < items.length ? round() : gameWin(st, L, gi, miss), ok ? 700 : 1400);
    };
    later(() => finish(false), T);
    $$(".fopt", st).forEach(b => b.onclick = () => finish(+b.dataset.i === a, b));
  };
  round();
}

/* ================= QUIZ ENGINE ================= */
function runQuiz(el, qs, opt) {
  const items = qs.map(q => Object.assign({}, q, { ord: shuffle(q.o.map((_, k) => k)) }));
  let i = 0; const res = [];
  const show = () => {
    const q = items[i];
    el.innerHTML = `<div class="quiz card">
      <div class="qtop"><span>سؤال ${i + 1} من ${items.length}</span><div class="bar"><i style="transform:scaleX(${i / items.length})"></i></div></div>
      ${q.p ? `<details class="passage" ${i === items.findIndex(x => x.p) ? "open" : ""}><summary>${esc(EXAM_PASSAGE.t)} (اضغط لعرض القطعة)</summary><p dir="ltr">${esc(EXAM_PASSAGE.en)}</p>${spk(EXAM_PASSAGE.en)}</details>` : ""}
      <h3 class="qq" dir="ltr">${blank(q.q)} ${spk(q.q.replace(/_{3,}/g, "..."))}</h3>
      ${q.h ? `<p class="qh">${esc(q.h)}</p>` : ""}
      <div class="opts">${q.ord.map((k, n) => `<button class="opt" data-k="${k}" dir="${dirOf(q.o[k])}"><span class="ol">${"ABCD"[n]}</span><span>${esc(q.o[k])}</span></button>`).join("")}</div>
      <div class="fb" id="fb" aria-live="polite"></div></div>`;
    $$(".opt", el).forEach(b => b.onclick = () => pick(b, q));
  };
  const pick = (b, q) => {
    if (el.querySelector(".opt.picked")) return;
    const k = +b.dataset.k, ok = k === q.a;
    res.push({ q, k, ok }); b.classList.add("picked");
    if (opt.mode === "exam") {
      sfx.tap(); later(next, 380); return;
    }
    $$(".opt", el).forEach(x => { if (+x.dataset.k === q.a) x.classList.add("ok"); });
    if (!ok) { b.classList.add("no"); shake(b); sfx.no(); } else sfx.ok();
    $("#fb", el).innerHTML = `<div class="fbbox ${ok ? "good" : "bad"}"><b>${ok ? pickOne(["صح! 👏", "ممتاز! 🌟", "أحسنت! ✅", "برافو! 🎉"]) : "ليست صحيحة 🙈"}</b><p>${bidi(q.w || "")}</p>
      <button class="btn primary" id="nextQ"><span>${i + 1 < items.length ? "السؤال التالي" : "النتيجة"}</span><i class="bi">${ICON.go}</i></button></div>`;
    $("#nextQ").onclick = next; $("#nextQ").focus({ preventScroll: true });
  };
  const next = () => { i++; i < items.length ? show() : opt.done(res); };
  show();
}
const pickOne = a => a[Math.floor(Math.random() * a.length)];
const starsFor = pct => pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;

function quizTab(st, L) {
  st.innerHTML = `<div class="card qintro"><span class="big">📝</span><h3>اختبار الدرس</h3><p>${L.quiz.length} أسئلة. بعد كل إجابة سترى الشرح.</p>
    <p class="muted">90٪ = ⭐⭐⭐ · 70٪ = ⭐⭐ · 50٪ = ⭐</p><button class="btn primary" id="qStart"><span>ابدأ الاختبار</span><i class="bi">${ICON.go}</i></button></div>`;
  $("#qStart").onclick = () => runQuiz(st, shuffle(L.quiz), {
    mode: "practice", done: res => {
      const c = res.filter(r => r.ok).length, pct = Math.round(c / res.length * 100), s = starsFor(pct);
      const before = P.stars[L.id] || 0; P.stars[L.id] = Math.max(before, s); save(); bumpStars();
      sfx.win(); if (s >= 2) confetti();
      const ls = unitLessons(L.unit), nx = ls[ls.indexOf(L) + 1];
      st.innerHTML = `<div class="card result"><div class="winst">${starStr(s)}</div><h3>${c} من ${res.length} صحيحة (${pct}٪)</h3>
        <p>${s === 3 ? "ممتاز! أنت جاهز لهذا الدرس 🏅" : s === 2 ? "جميل جداً! راجع الأخطاء وجرّب مرة ثانية للنجمة الثالثة ✨" : s === 1 ? "بداية جيدة! ارجع للشرح وللألعاب ثم أعد المحاولة 💪" : "لا بأس! اقرأ الشرح مرة ثانية والعب الألعاب، ثم جرّب 🌱"}</p>
        ${mistakes(res)}
        <div class="nextrow"><button class="btn soft" id="qAgain">🔄 أعد الاختبار</button>
        ${nx ? `<a class="btn primary" href="#/l/${nx.id}/learn"><span>الدرس التالي</span><i class="bi">${ICON.go}</i></a>` : `<a class="btn primary" href="#/u/${L.unit}"><span>ارجع للوحدة</span><i class="bi">${ICON.go}</i></a>`}</div></div>`;
      $("#qAgain").onclick = () => quizTab(st, L);
      if (s > before) lessonStarsRefresh(L);
    }
  });
}
const lessonStarsRefresh = L => { const e = $(".lh-st"); if (e) e.textContent = starStr(P.stars[L.id] || 0); };
function mistakes(res) {
  const m = res.filter(r => !r.ok);
  if (!m.length) return "";
  return `<details class="mist"><summary>راجع أخطاءك (${m.length})</summary>${m.map(r => `<div class="mi"><p dir="ltr" class="en">${blank(r.q.q)}</p>
    <p><span class="x">✘ ${esc(r.q.o[r.k])}</span> <span class="v">✔ ${esc(r.q.o[r.q.a])}</span></p><p class="muted">${bidi(r.q.w || "")}</p>
    ${r.q.lid ? `<a href="#/l/${r.q.lid}/learn">راجع الدرس: <span dir="ltr">${esc(LES[r.q.lid].en)}</span></a>` : ""}</div>`).join("")}</details>`;
}

/* ================= UNIT REVIEW ================= */
function reviewView(id) {
  const u = UNIT[id];
  const pool = shuffle(unitLessons(id).flatMap(l => l.quiz.map(q => Object.assign({}, q, { lid: l.id })))).slice(0, 10);
  app().innerHTML = `<nav class="crumbs"><a href="#/">الخريطة</a><span>/</span><a href="#/u/${id}">${esc(u.ar)}</a></nav>
    <section class="lhead" style="${cvars(u)}"><span class="lh-ic">🔁</span><div><small dir="ltr">${unitNo(id)}</small><h1>مراجعة الوحدة</h1><p dir="ltr">${esc(u.en)}</p></div></section>
    <div id="stage" style="${cvars(u)}"></div>`;
  const st = $("#stage");
  runQuiz(st, pool, { mode: "practice", done: res => {
    const c = res.filter(r => r.ok).length, pct = Math.round(c / res.length * 100);
    sfx.win(); if (pct >= 70) confetti();
    st.innerHTML = `<div class="card result"><div class="winst">${starStr(starsFor(pct))}</div><h3>${c} من ${res.length} (${pct}٪)</h3>${mistakes(res)}
      <div class="nextrow"><a class="btn soft" href="#/review/${id}" id="rAgain">🔄 مراجعة جديدة</a><a class="btn primary" href="#/u/${id}"><span>ارجع للوحدة</span><i class="bi">${ICON.go}</i></a></div></div>`;
    $("#rAgain").onclick = e => { e.preventDefault(); reviewView(id); };
  } });
}

/* ================= FINAL EXAM ================= */
function examView() {
  app().innerHTML = `<nav class="crumbs"><a href="#/">${ICON.back} الخريطة</a></nav>
  <section class="lhead exam" style="--c:var(--gold);--cs:var(--gold-soft)"><span class="lh-ic">🏆</span><div><small dir="ltr">Final test · 7A</small><h1>الاختبار النهائي</h1><p>تدرّب كأنك في الامتحان الحقيقي!</p></div></section>
  <div id="stage" style="--c:var(--gold);--cs:var(--gold-soft)">
    <div class="card qintro"><span class="big">🎯</span><h3>قبل أن تبدأ</h3>
    <ul class="rules"><li>${EXAM_N} سؤالاً من كل الوحدات: كلمات، قواعد، قصص، وقراءة.</li><li>لن ترى الإجابة الصحيحة أثناء الاختبار، مثل الامتحان الحقيقي.</li><li>في النهاية ترى نتيجتك لكل وحدة، والدروس التي تحتاج مراجعة.</li><li>كل مرة تبدأ، تأتيك أسئلة مختلفة!</li></ul>
    ${P.exam != null ? `<p class="muted">أفضل نتيجة لك: ${P.exam}٪</p>` : ""}
    <button class="btn primary" id="eStart"><span>ابدأ الاختبار</span><i class="bi">${ICON.go}</i></button></div></div>`;
  $("#eStart").onclick = () => {
    const qs = [];
    UNITS.forEach(u => unitLessons(u.id).forEach(l => { if (u.id === "w") return; qs.push(Object.assign({}, pickOne(l.quiz), { lid: l.id, unit: u.id })); }));
    qs.push(Object.assign({}, pickOne(LES.w1.quiz), { lid: "w1", unit: "w" }));
    const st = $("#stage");
    runQuiz(st, [...qs, ...EXAM_EXTRA], { mode: "exam", done: res => examResult(st, res) });
  };
}
function examResult(st, res) {
  const c = res.filter(r => r.ok).length, pct = Math.round(c / res.length * 100);
  P.exam = Math.max(P.exam || 0, pct); save();
  sfx.win(); if (pct >= 60) confetti();
  const groups = [...UNITS.map(u => ({ id: u.id, n: unitNo(u.id), ar: u.ar, c: u.c })), { id: "exam", n: "Reading & dialogues", ar: "القراءة والحوار", c: "gold" }];
  const rows = groups.map(g => { const rs = res.filter(r => r.q.unit === g.id); if (!rs.length) return ""; const ok = rs.filter(r => r.ok).length;
    return `<div class="urow" style="--c:var(--${g.c})"><span><b dir="ltr">${g.n}</b> ${g.ar}</span><div class="bar"><i style="transform:scaleX(${ok / rs.length})"></i></div><em>${ok}/${rs.length}</em></div>`; }).join("");
  const grade = pct >= 90 ? ["🏅", "ممتاز! أنت جاهز تماماً للاختبار النهائي!"] : pct >= 75 ? ["🌟", "جيد جداً! راجع الأخطاء القليلة وستكون جاهزاً."] : pct >= 50 ? ["💪", "جيد! راجع الدروس المقترحة تحت وجرّب مرة ثانية."] : ["🌱", "تحتاج مراجعة أكثر. ابدأ بالدروس المقترحة والعب ألعابها."];
  const weak = [...new Set(res.filter(r => !r.ok && r.q.lid).map(r => r.q.lid))];
  st.innerHTML = `<div class="card result"><div class="score" style="--p:${pct}"><span>${pct}٪</span></div>
    <h3>${grade[0]} ${c} من ${res.length} صحيحة</h3><p>${grade[1]}</p>
    <div class="urows">${rows}</div>
    ${weak.length ? `<h4 class="sec">📚 دروس أنصحك تراجعها</h4><div class="weak">${weak.map(id => `<a href="#/l/${id}/learn" style="${cvars(UNIT[LES[id].unit])}"><span>${LES[id].icon}</span><b dir="ltr">${esc(LES[id].en)}</b></a>`).join("")}</div>` : ""}
    ${mistakes(res)}
    <div class="nextrow"><button class="btn primary" id="eAgain"><span>اختبار جديد</span><i class="bi">🔄</i></button><a class="btn soft" href="#/">🗺️ الخريطة</a></div></div>`;
  $("#eAgain").onclick = () => examView();
}

/* ---------- boot ---------- */
header();
route();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);

</script>
