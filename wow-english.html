<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عالم العجائب — WOW! English 7A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EAF5F1; --bg2:#DDEFE8; --card:#FFFFFF; --ink:#21404D; --ink2:#5A7682; --line:#D3E5DF;
  --good:#3DAA72; --good-t:#E0F4E9; --bad:#E86F62; --bad-t:#FDE7E3; --star:#FFBE2E;
  --lav:#9D8DDF; --lav-t:#EFEBFB; --lav-d:#7B6ACB;
  --coral:#FF8F70; --coral-t:#FFEAE3; --coral-d:#E56D4E;
  --leaf:#63BA77; --leaf-t:#E2F4E6; --leaf-d:#48A05D;
  --sky:#58A9E0; --sky-t:#E0EFFA; --sky-d:#3C8DC6;
  --honey:#EFAE33; --honey-t:#FDF1D6; --honey-d:#D29220;
  --berry:#E0779F; --berry-t:#FBE5EE; --berry-d:#C65A83;
  --c:var(--sky); --t:var(--sky-t); --d:var(--sky-d);
  --shadow:0 10px 30px -12px rgba(33,64,77,.22);
  --ease:cubic-bezier(.34,1.4,.64,1);
  --font:"Baloo Bhaijaan 2","Segoe UI",Tahoma,"Geeza Pro",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#132329; --bg2:#182C33; --card:#1C3139; --ink:#E4F0EE; --ink2:#9CB4BD; --line:#2B4550;
    --good-t:#1D3D2E; --bad-t:#43282A;
    --lav-t:#2A2946; --coral-t:#43302C; --leaf-t:#20392A; --sky-t:#1E3547; --honey-t:#3F3421; --berry-t:#402636;
    --shadow:0 10px 30px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#132329; --bg2:#182C33; --card:#1C3139; --ink:#E4F0EE; --ink2:#9CB4BD; --line:#2B4550;
  --good-t:#1D3D2E; --bad-t:#43282A;
  --lav-t:#2A2946; --coral-t:#43302C; --leaf-t:#20392A; --sky-t:#1E3547; --honey-t:#3F3421; --berry-t:#402636;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6;min-height:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(40rem 30rem at 110% -10%,var(--sky-t),transparent 60%),radial-gradient(35rem 28rem at -15% 110%,var(--leaf-t),transparent 60%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:12px}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--font)}
b{font-weight:700}

/* ---------- app bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:center;padding:12px 12px 0}
.bar-in{display:flex;align-items:center;gap:10px;background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:999px;padding:6px 8px 6px 14px;box-shadow:var(--shadow);max-width:760px;width:100%}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;text-decoration:none;color:var(--ink);margin-inline-end:auto}
.brand .globe{font-size:26px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--ink2);line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;background:var(--honey-t);font-weight:700}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--bg2)}

main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:18px 16px 60px}

/* ---------- common ---------- */
.card{background:var(--card);border-radius:26px;padding:20px;box-shadow:var(--shadow)}
.muted{color:var(--ink2)}
h1,h2,h3{line-height:1.25;margin:0}
h1{font-size:30px;font-weight:800}
h2{font-size:23px;font-weight:800}
h3{font-size:19px;font-weight:700}
.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:8px 22px;border-radius:18px;font-weight:700;font-size:18px;
  background:var(--card);border:2px solid var(--c);box-shadow:0 5px 0 var(--c);transition:transform .15s var(--ease),box-shadow .15s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--c)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:0 5px 0 #0d2029;box-shadow:0 5px 0 color-mix(in srgb,var(--ink) 60%,#000)}
.btn.primary:active{box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 60%,#000)}
.btn.small{min-height:42px;padding:4px 16px;font-size:16px;border-radius:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink2);text-decoration:none;padding:6px 4px;margin-bottom:8px}
.speak{width:38px;height:38px;flex:none;border-radius:50%;display:inline-grid;place-items:center;background:var(--t);font-size:18px;transition:transform .2s var(--ease)}
.speak:active{transform:scale(.88)}
.stars{letter-spacing:1px;font-size:16px;white-space:nowrap}
.progress{height:14px;border-radius:99px;background:var(--bg2);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--leaf),var(--sky));transition:width .8s var(--ease)}

/* ---------- home ---------- */
.hero{display:grid;gap:14px;margin:6px 0 20px}
.hero h1 .wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.2s ease-in-out 1}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
.name-form{display:flex;gap:10px;flex-wrap:wrap}
.name-form input{flex:1 1 200px;min-height:52px;border-radius:16px;border:2px solid var(--line);background:var(--card);padding:0 16px;font-size:18px}
.ready{display:grid;gap:8px}
.ready .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.path{position:relative;direction:ltr;margin:10px auto 0;max-width:440px}
.path svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.path path{fill:none;stroke:var(--line);stroke-width:7;stroke-linecap:round;stroke-dasharray:2 16;vector-effect:non-scaling-stroke}
.station{position:absolute;width:160px;display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none;color:var(--ink)}
.station .disc{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:44px;background:var(--c);
  box-shadow:0 7px 0 var(--d),0 16px 26px -10px var(--d);transition:transform .25s var(--ease);position:relative}
.station .disc::after{content:"";position:absolute;inset:7px;border-radius:50%;border:3px dashed rgba(255,255,255,.55)}
.station:hover .disc{transform:translateY(-4px) rotate(-4deg)}
.station:active .disc{transform:translateY(4px);box-shadow:0 2px 0 var(--d)}
.station .lbl{margin-top:12px;font-weight:800;font-size:18px;line-height:1.2;direction:rtl}
.station .lbl small{display:block;font-weight:500;color:var(--ink2);font-size:14px;direction:ltr}
.station .stars{margin-top:2px;font-size:14px;color:var(--ink2)}
.station.done .disc::before{content:"✓";position:absolute;top:-4px;right:-4px;width:30px;height:30px;border-radius:50%;background:var(--good);color:#fff;font-size:18px;display:grid;place-items:center;font-weight:800;z-index:1}

/* ---------- unit ---------- */
.unit-head{background:var(--t);border-radius:30px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.unit-head .big{font-size:58px;width:92px;height:92px;border-radius:28px;background:var(--card);display:grid;place-items:center;box-shadow:0 6px 0 var(--c)}
.unit-head .kicker{font-weight:700;color:var(--d)}
.wowq{grid-column:1/-1;background:var(--card);border-radius:20px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.wowq .en{font-weight:700}
.lessons{display:grid;gap:12px;margin-top:18px}
.lesson-row{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;text-align:start;background:var(--card);border-radius:22px;padding:12px 14px;
  box-shadow:0 4px 0 var(--t),var(--shadow);text-decoration:none;color:var(--ink);transition:transform .2s var(--ease)}
.lesson-row:hover{transform:translateX(-4px)}
.lesson-row .num{width:32px;height:32px;border-radius:50%;background:var(--t);color:var(--d);font-weight:800;display:grid;place-items:center}
.lesson-row .emo{font-size:32px}
.lesson-row .t{font-weight:700;line-height:1.3}
.lesson-row .t small{display:block;font-weight:500;color:var(--ink2);font-size:14px}
.unit-test{margin-top:18px;display:flex;justify-content:center}

/* ---------- lesson ---------- */
.l-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.l-head .emo{font-size:40px;width:64px;height:64px;border-radius:20px;background:var(--t);display:grid;place-items:center;flex:none}
.l-head small{display:block;color:var(--ink2);font-weight:500;font-size:15px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border-radius:20px;padding:6px;box-shadow:var(--shadow);position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);z-index:10;margin-bottom:18px}
.tabs a{text-align:center;padding:10px 4px;border-radius:15px;font-weight:700;text-decoration:none;color:var(--ink2);transition:background .25s,color .25s}
.tabs a[aria-current="page"]{background:var(--c);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.15)}
.stack{display:grid;gap:16px}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bi>div{border-radius:20px;padding:16px;background:var(--bg)}
.bi .lang{display:inline-block;font-size:13px;font-weight:700;color:var(--d);background:var(--t);border-radius:99px;padding:0 10px;margin-bottom:6px}
@media (max-width:640px){.bi{grid-template-columns:1fr}}
.tip{display:flex;gap:10px;background:var(--honey-t);border-radius:18px;padding:12px 14px}
.tip .i{font-size:24px;line-height:1.3}
.formula{display:grid;gap:8px}
.formula .fr{display:grid;grid-template-columns:1fr auto 1.4fr;gap:6px;direction:ltr}
.formula .fr>span{background:var(--bg);border-radius:12px;padding:6px 10px;font-weight:600;font-size:16px}
.formula .fr>span:nth-child(2){background:var(--t);color:var(--d);font-weight:800;text-align:center}
@media (max-width:520px){.formula .fr{grid-template-columns:1fr}.formula .fr>span:nth-child(2){text-align:start}}
.ex-list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.ex{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:16px;padding:10px 12px}
.ex .en{font-weight:600;display:block}
.ex .ar{color:var(--ink2);font-size:16px;display:block}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.vcard{background:var(--card);border:2px solid var(--t);border-radius:22px;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;
  transition:transform .2s var(--ease),border-color .2s}
.vcard:hover{transform:translateY(-3px);border-color:var(--c)}
.vcard:active{transform:scale(.96)}
.vcard .e{font-size:44px;line-height:1.2}
.vcard .w{font-weight:800;direction:ltr;font-size:18px;line-height:1.2}
.vcard .a{color:var(--ink2);font-size:15px;line-height:1.3}
.story{border-inline-start:6px solid var(--c)}
.story p{margin:0 0 10px;display:flex;gap:10px;align-items:flex-start}
.story p .en{flex:1;text-align:left}
.story details{margin-top:6px;background:var(--t);border-radius:14px;padding:8px 12px}
.story summary{cursor:pointer;font-weight:700}
.facts{display:grid;gap:12px}
.fact{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--bg);border-radius:18px;padding:12px}
.fact .e{font-size:34px}
.fact h3{direction:ltr;text-align:right;font-size:17px}
.scale{display:grid;gap:8px}
.scale .s{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:16px;padding:8px 12px}
.scale .s .e{font-size:28px}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.meter>div{border-radius:18px;padding:12px 6px;font-weight:700}
.meter .m1{background:var(--good-t)}.meter .m2{background:var(--honey-t)}.meter .m3{background:var(--bad-t)}
.meter .big{font-size:26px;display:block}
.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;direction:ltr}
.tbl td,.tbl th{padding:8px 10px;background:var(--bg);text-align:left;font-size:16px}
.tbl th{background:var(--t);color:var(--d)}
.tbl tr td:first-child,.tbl tr th:first-child{border-radius:12px 0 0 12px}
.tbl tr td:last-child,.tbl tr th:last-child{border-radius:0 12px 12px 0}
.scroll-x{overflow-x:auto}
.clocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;text-align:center}
.clocks figure{margin:0;background:var(--bg);border-radius:20px;padding:10px}
.clocks figcaption{font-weight:700;direction:ltr;font-size:15px}
.carroll{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;font-size:15px;text-align:center}
.carroll>div{background:var(--bg);border-radius:12px;padding:8px}
.carroll .h{background:var(--t);font-weight:700;color:var(--d)}
.cta{display:flex;justify-content:center;margin-top:6px}

/* ---------- games ---------- */
.gpick{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.gpick button{flex:none;border-radius:999px;padding:8px 16px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:16px;transition:all .2s}
.gpick button[aria-pressed="true"]{border-color:var(--c);background:var(--t);color:var(--ink)}
.stage{background:var(--card);border-radius:28px;padding:18px;box-shadow:var(--shadow);min-height:320px}
.g-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.count{font-weight:700;color:var(--ink2);font-size:15px}
.pbar{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-bottom:14px}
.pbar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .5s var(--ease)}

.qcard{background:var(--t);border-radius:22px;padding:16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.qcard .qt{flex:1;font-weight:700;font-size:21px;line-height:1.4}
.qextra{text-align:center;font-size:24px;margin:-4px 0 14px}
.qextra.pic{font-size:84px;line-height:1.1}
.hint{margin:-6px 0 12px;font-size:16px;color:var(--ink2)}
.hint button{color:var(--d);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:16px}
.opts{display:grid;gap:10px}
.opt{min-height:58px;border-radius:18px;padding:8px 16px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:700;font-size:19px;text-align:center;
  transition:transform .15s var(--ease),background .2s,border-color .2s}
.opt:hover{border-color:var(--c)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--good-t);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.no{background:var(--bad-t);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:18px;padding:12px 14px;display:grid;gap:4px;animation:pop .45s var(--ease)}
.fb.ok{background:var(--good-t)}.fb.no{background:var(--bad-t)}
.fb strong{font-size:19px}
.next{margin-top:14px;display:flex;justify-content:flex-start}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* flash */
.flash{perspective:1000px;margin:6px auto 14px;max-width:360px}
.flash .inner{position:relative;height:260px;transform-style:preserve-3d;transition:transform .6s var(--ease)}
.flash.flipped .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;text-align:center;
  background:var(--t);border:3px solid var(--c)}
.flash .back{transform:rotateY(180deg);background:var(--card)}
.flash .e{font-size:92px;line-height:1.1}
.flash .w{font-size:28px;font-weight:800;direction:ltr}
.flash .a{font-size:26px;font-weight:800}
.flash .d{font-size:17px;color:var(--ink2);direction:ltr}
.flash-nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;perspective:800px}
@media (max-width:480px){.mem{grid-template-columns:repeat(3,1fr)}}
.mcard{aspect-ratio:1/1;position:relative;transform-style:preserve-3d;transition:transform .45s var(--ease);border-radius:18px}
.mcard.up,.mcard.done{transform:rotateY(180deg)}
.mcard .f{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:6px;text-align:center}
.mcard .f1{background:var(--c);box-shadow:inset 0 -5px 0 var(--d);font-size:30px;color:#fff}
.mcard .f2{background:var(--card);border:3px solid var(--c);transform:rotateY(180deg);font-weight:800;direction:ltr;font-size:clamp(13px,3.6vw,17px);line-height:1.15;word-break:break-word}
.mcard .f2.emo{font-size:clamp(30px,9vw,44px)}
.mcard.done .f2{background:var(--good-t);border-color:var(--good)}

/* sort */
.tray{display:flex;justify-content:center;margin:6px 0 18px;min-height:64px}
.chip{display:inline-flex;align-items:center;border-radius:16px;padding:8px 16px;background:var(--card);border:2px solid var(--c);box-shadow:0 4px 0 var(--c);font-weight:700;direction:ltr;font-size:18px}
.tray .chip{font-size:22px;padding:12px 22px;animation:pop .4s var(--ease)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.buckets.grid{grid-template-columns:1fr 1fr}
.bucket{border-radius:22px;padding:10px;background:var(--bg);border:2px dashed var(--line);min-height:130px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center;transition:border-color .2s,background .2s}
.bucket:hover{border-color:var(--c);background:var(--t)}
.bucket .bh{font-weight:800;font-size:18px;direction:ltr}
.bucket .bh .ico{font-size:22px}
.bucket .ba{font-size:14px;color:var(--ink2)}
.bucket .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.bucket .in span{background:var(--good-t);border-radius:10px;padding:2px 8px;font-size:14px;direction:ltr;font-weight:600;animation:pop .35s var(--ease)}

/* order */
.oprompt{text-align:center;color:var(--ink2);margin-bottom:10px}
.oline{min-height:70px;border-radius:20px;border:2px dashed var(--c);background:var(--t);padding:10px;display:flex;flex-wrap:wrap;gap:8px;direction:ltr;align-content:flex-start;margin-bottom:14px}
.obank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr;min-height:56px}
.tok{border-radius:14px;padding:8px 14px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:18px;transition:transform .15s var(--ease)}
.tok:active{transform:translateY(2px)}
.oline .tok{border-color:var(--c);box-shadow:0 3px 0 var(--c)}
.oline.chips{flex-direction:column;align-items:stretch}
.oline.chips .tok{text-align:left}
.tok.letter{min-width:46px;font-size:22px;text-transform:lowercase}
.oline.good{border-style:solid;border-color:var(--good);background:var(--good-t)}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;direction:ltr}
.match .col{display:grid;gap:8px;align-content:start}
.mitem{border-radius:16px;padding:10px 12px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:600;font-size:16px;text-align:left;line-height:1.35;transition:all .2s}
.mitem.sel{border-color:var(--c);background:var(--t);box-shadow:0 3px 0 var(--c)}
.mitem.ok{border-color:var(--good);background:var(--good-t);box-shadow:none;opacity:.85}

/* results */
.result{text-align:center;display:grid;gap:12px;justify-items:center;padding:10px 0}
.result .big{font-size:64px;line-height:1}
.result .rstars{font-size:44px;letter-spacing:6px}
.result .rstars .off{filter:grayscale(1);opacity:.3}
.review{width:100%;text-align:start;display:grid;gap:8px;margin-top:6px}
.review a{display:flex;justify-content:space-between;gap:8px;background:var(--bg);padding:10px 14px;border-radius:14px;text-decoration:none;color:var(--ink);font-weight:600}
.ubars{width:100%;display:grid;gap:10px;text-align:start}
.ubars .ub{display:grid;grid-template-columns:130px 1fr 48px;gap:10px;align-items:center;font-weight:700;font-size:16px}
.cert{width:100%;border-radius:26px;padding:22px;background:var(--honey-t);border:4px double var(--honey);display:grid;gap:4px}
.cert .cname{font-size:30px;font-weight:800}

/* confetti */
.cf{position:fixed;width:10px;height:10px;border-radius:3px;pointer-events:none;z-index:30;animation:cf .9s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.unit-head .en,.lesson-row .en,.l-head .en,.wowq .en,.brand .en{text-align:right}
</style>
</head>

/* ===== ENGINE ===== */
(function () {

  const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const unitById = id => UNITS.find(u => u.id === id);

  const starStr = n => '⭐'.repeat(n) + '<span style="opacity:.35">' + '☆'.repeat(3 - n) + '</span>';

  /* ---------- sound + speech ---------- */
  let ac = null;
  function tone(freqs, dur = 0.12, type = 'sine', gap = 0.09) {
    if (S.mute) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      freqs.forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * gap;
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.03);
      });
    } catch (e) {}
  }
  const sfx = { ok: () => tone([660, 990]), bad: () => tone([320, 250], 0.16, 'triangle'), win: () => tone([523, 659, 784, 1047], 0.2, 'sine', 0.12), flip: () => tone([540], 0.05) };
  let voice = null;
  function pickVoice() { try { const vs = speechSynthesis.getVoices(); voice = vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; } catch (e) {} }
  try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
  function say(t) {
    try {
      if (!('speechSynthesis' in window) || S.mute) return;
      const clean = String(t).replace(/<[^>]+>/g, ' ').replace(/___/g, ' blank ').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}\u{2B00}-\u{2BFF}]/gu, '').replace(/[\u0600-\u06FF]+/g, '');
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(clean); u.lang = 'en-GB'; if (voice) u.voice = voice; u.rate = 0.85;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function burst(x, y) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cols = ['#FF8F70', '#63BA77', '#58A9E0', '#FFBE2E', '#9D8DDF', '#E0779F'];
    for (let i = 0; i < 16; i++) {
      const s = document.createElement('span'); s.className = 'cf';
      const a = Math.random() * Math.PI * 2, r = 60 + Math.random() * 90;
      s.style.cssText = `left:${x}px;top:${y}px;background:${cols[i % cols.length]};--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r - 40}px`;
      document.body.appendChild(s); setTimeout(() => s.remove(), 950);
    }
  }
  const burstAt = el => { const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2); };
  const cheers = ['أحسنت! 🎉', 'رائع! 🌟', 'ممتاز! 👏', 'بطل! 💪', 'صح عليك! ✨', 'Great job! 🎉', 'Well done! 🌟'];
  const cheer = () => cheers[Math.floor(Math.random() * cheers.length)];

    if (m === 15) return `It's quarter past ${NUM[h]}.`;
    if (m === 30) return `It's half past ${NUM[h]}.`;
    return `It's quarter to ${NUM[h % 12 + 1]}.`;
  }
  function clockSVG(h, m, size = 120) {

    return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="clock" style="color:var(--ink)"><circle cx="50" cy="50" r="47" fill="var(--card)" stroke="var(--c)" stroke-width="5"/>${ticks}
      <line x1="50" y1="50" x2="${50 + 22 * Math.sin(ha * Math.PI / 180)}" y2="${50 - 22 * Math.cos(ha * Math.PI / 180)}" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <line x1="50" y1="50" x2="${50 + 33 * Math.sin(ma * Math.PI / 180)}" y2="${50 - 33 * Math.cos(ma * Math.PI / 180)}" stroke="var(--d)" stroke-width="3.5" stroke-linecap="round"/>

  /* ----- sort ----- */

  /* ----- order (sentences / letters / chips) ----- */
  function mountOrder(el, g) {

      if (t >= tasks.length) return endScreen(el, { score: tasks.length, total: tasks.length, title: 'رتّبت كل شيء! 🧩', onRetry: () => mountOrder(el, g) });
      const [text, ar, emo] = tasks[t];
      const answer = g.letters ? text.split('') : g.chips ? text.split('|') : text.split(' ');
      let bank = shuffle(answer.map((w, k) => ({ w, k })));
      if (answer.length > 1) { let guard = 0; while (bank.every((b, n) => b.w === answer[n]) && guard++ < 10) bank = shuffle(bank); }
      const line = []; tries = 0;
      const cls = g.letters ? 'tok letter' : 'tok';
      el.innerHTML = `<div class="g-title"><span class="count">${g.letters ? 'كوّن الكلمة' : g.chips ? 'رتّب بالضغط بالترتيب' : 'رتّب الكلمات لتكوين جملة'} (${t + 1} / ${tasks.length})</span><button class="btn small" data-hint>💡 تلميح</button></div>

      }

      });

    }

  /* ----- auto games from vocab ----- */

  function clockGame(el) {
    const qs = [];
    const used = new Set();
    while (qs.length < 6) {
      const h = 1 + Math.floor(Math.random() * 12), m = [0, 15, 30, 45][Math.floor(Math.random() * 4)];
      if (used.has(h + ':' + m)) continue; used.add(h + ':' + m);
      const right = timeText(h, m), opts = new Set([right]);
      [[h, (m + 30) % 60], [h % 12 + 1, m], [h, m === 15 ? 45 : 15], [(h + 10) % 12 + 1, m]].forEach(([a, b]) => { if (opts.size < 3) opts.add(timeText(a, b)); });
      qs.push({ q: 'What time is it?', clock: [h, m], o: Array.from(opts), why: 'العقرب القصير للساعات، والطويل للدقائق.' });

    if (L.clocks) h += `<div class="card"><h3 style="margin-bottom:10px">قراءة الساعة 🕒</h3><div class="clocks">${L.clocks.map(c => `<figure>${clockSVG(c[0], c[1], 110)}<figcaption>${esc(c[2])}</figcaption><div class="muted" style="font-size:14px">${esc(c[3])}</div></figure>`).join('')}</div></div>`;
    if (L.scale) h += `<div class="card"><h3 style="margin-bottom:10px">قل شعورك 💬</h3><div class="scale">${L.scale.map(s => `<div class="s"><span class="e">${s[0]}</span><span><span class="en" style="font-weight:700;display:block">${esc(s[1])}</span><span class="muted" style="font-size:15px">${esc(s[2])}</span></span><button class="speak" data-say="${esc(s[1])}" aria-label="استمع">🔊</button></div>`).join('')}</div></div>`;
    if (L.carroll) h += `<div class="card"><h3 style="margin-bottom:10px">مثال: مخطط كارول 🔲</h3><div class="carroll"><div></div><div class="h">💡 needs light</div><div class="h">💡 doesn't need light</div><div class="h">🔊 needs sound</div><div class="en">theatre, cinema</div><div class="en">street parade</div><div class="h">🔊 doesn't need sound</div><div class="en">bowling alley, art gallery</div><div class="en">trampoline, zip wire</div></div></div>`;
    if (L.factfile) h += `<div class="card"><h3 style="margin-bottom:8px">Fact file: ${esc(L.factfile.name)}</h3><div class="scroll-x"><table class="tbl">${L.factfile.rows.map(r => `<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}</table></div></div>`;
    if (L.timetable) h += `<div class="card"><h3 style="margin-bottom:8px">جدول المواعيد 🕒 Timetable</h3>${ttTable(L.timetable)}</div>`;
    if (L.examples) h += `<div class="card"><h3 style="margin-bottom:10px">أمثلة 🗣️</h3><ul class="ex-list">${L.examples.map(e => `<li class="ex"><button class="speak" data-say="${esc(e[0])}" aria-label="استمع">🔊</button><span><span class="en">${esc(e[0])}</span><span class="ar">${esc(e[1])}</span></span></li>`).join('')}</ul></div>`;
    const stories = L.stories || (L.story ? [L.story] : []);
    stories.forEach(s => {
      h += `<div class="card story"><h3 style="margin-bottom:12px">📖 ${esc(s.title)}</h3>${s.en.map(p => `<p><button class="speak" data-say="${esc(p)}" aria-label="استمع">🔊</button><span class="en">${p}</span></p>`).join('')}
        <details><summary>الملخص بالعربي 🇴🇲</summary><div style="margin-top:6px">${s.ar}</div></details></div>`;
    });
    if (L.facts) h += `<div class="facts">${L.facts.map(c => `<div class="fact"><span class="e">${c[0]}</span><div><h3>${esc(c[1])}</h3><div>${esc(c[2])}</div></div></div>`).join('')}</div>`;
    h += `<div class="cta"><a class="btn primary" href="#/l/${u.id}/${l.id}/play">فهمت! هيا نلعب 🎮</a></div>`;
    return h;
  }

  function pageLesson(u, l, tab) {
    document.title = l.ar + ' — ' + l.en;
    const k = u.lessons.indexOf(l), next = u.lessons[k + 1];
    const tabs = [['learn', '📖 الشرح'], ['play', '🎮 ألعاب'], ['quiz', '📝 اختبار']];
    app.innerHTML = `<div style="${colorVars(u)}">
      <a class="back" href="#/u/${u.id}">➡ ${esc(u.ar)}</a>
      <div class="l-head"><span class="emo" aria-hidden="true">${l.emoji}</span><div><h2>${esc(l.ar)}</h2><small class="en">${esc(l.en)}</small></div><span class="stars" style="margin-inline-start:auto">${starStr(S.stars[lessonKey(u, l)] || 0)}</span></div>
      <nav class="tabs">${tabs.map(t => `<a href="#/l/${u.id}/${l.id}/${t[0]}" ${t[0] === tab ? 'aria-current="page"' : ''}>${t[1]}</a>`).join('')}</nav>
      <div data-body class="stack"></div></div>`;
    const body = $('[data-body]');
    if (tab === 'learn') {
      body.innerHTML = learnHTML(u, l);
      $$('[data-say]', body).forEach(b => b.addEventListener('click', () => say(b.dataset.say)));
      $$('[data-v]', body).forEach(b => b.addEventListener('click', () => { say(l.learn.vocab[+b.dataset.v][0]); b.animate([{ transform: 'scale(.92)' }, { transform: 'scale(1)' }], { duration: 300, easing: 'cubic-bezier(.34,1.4,.64,1)' }); }));
    } else if (tab === 'play') {
      const games = lessonGames(u, l);
      body.innerHTML = `<div class="gpick" role="toolbar" aria-label="الألعاب">${games.map((g, n) => `<button data-g="${n}" aria-pressed="${n === 0}">${esc(g.title)}</button>`).join('')}</div><div class="stage" data-stage></div>
        <div class="cta"><a class="btn primary" href="#/l/${u.id}/${l.id}/quiz">جاهز؟ ادخل الاختبار 📝</a></div>`;
      const stage = $('[data-stage]', body);
      const run = n => { $$('[data-g]', body).forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.g === n))); games[n].run(stage); };
      $$('[data-g]', body).forEach(b => b.addEventListener('click', () => run(+b.dataset.g)));
      run(0);
    } else {
      body.innerHTML = `<div class="stage" data-stage></div>`;
      const stage = $('[data-stage]', body);
      mountMCQ(stage, l.quiz, {
        lesson: l, starsKey: lessonKey(u, l), endTitle: 'انتهى اختبار الدرس!',
        onEnd: (el, score, total, wrong, retry) => {
          endScreen(el, { score, total, title: 'انتهى اختبار الدرس!', starsKey: lessonKey(u, l), onRetry: retry,
            extra: `<div class="row" style="justify-content:center">${next ? `<a class="btn primary small" href="#/l/${u.id}/${next.id}/learn">الدرس التالي: ${esc(next.ar)} ⬅</a>` : `<a class="btn primary small" href="#/t/${u.id}">📝 اختبار الوحدة</a>`}<a class="btn small" href="#/l/${u.id}/${l.id}/learn">📖 راجع الشرح</a></div>` });
          $('.l-head .stars').innerHTML = starStr(S.stars[lessonKey(u, l)] || 0);
        }
      });
    }
  }

  function tagged(u, l) { return l.quiz.map(q => Object.assign({}, q, { tag: `${u.emoji} ${l.ar}`, _u: u.id, _l: l.id })); }

  function pageUnitTest(u) {
    document.title = 'اختبار ' + u.ar;
    app.innerHTML = `<div style="${colorVars(u)}"><a class="back" href="#/u/${u.id}">➡ ${esc(u.ar)}</a>
      <div class="l-head"><span class="emo">📝</span><div><h2>اختبار الوحدة: ${esc(u.ar)}</h2><small>10 أسئلة من كل دروس الوحدة</small></div></div><div class="stage" data-stage></div></div>`;
    const pool = shuffle(u.lessons.flatMap(l => tagged(u, l))).slice(0, 10);
    const run = () => mountMCQ($('[data-stage]'), pool, { keepOrder: true, onEnd: (el, score, total, wrong, retry) => reviewEnd(el, score, total, wrong, () => pageUnitTest(u), 'نتيجة اختبار الوحدة') });
    run();
  }

  function reviewEnd(el, score, total, wrong, retry, title, extraTop = '') {
    const seen = new Set(), links = [];
    wrong.forEach(q => { const k = q._u + '/' + q._l; if (q._u && !seen.has(k)) { seen.add(k); const u = unitById(q._u), l = u.lessons.find(x => x.id === q._l); links.push(`<a href="#/l/${u.id}/${l.id}/learn"><span>${l.emoji} ${esc(l.ar)}</span><span>راجع ⬅</span></a>`); } });
    endScreen(el, { score, total, title, onRetry: retry, extra: extraTop + (links.length ? `<div class="review"><b>دروس تحتاج مراجعة 📖</b>${links.join('')}</div>` : '<p style="margin:0">لا توجد أخطاء تحتاج مراجعة. رائع! 🎯</p>') });
  }

  function pageExam() {
    document.title = 'الاختبار النهائي';
    const style = '--c:var(--berry);--t:var(--berry-t);--d:var(--berry-d)';
    app.innerHTML = `<div style="${style}"><a class="back" href="#/">➡ الخريطة</a>
      <div class="l-head"><span class="emo">🏆</span><div><h2>الاختبار النهائي</h2><small>Final test — 30 سؤالاً من كل الكتاب</small></div></div>
      <div class="stage" data-stage>
        <div class="result"><div class="big">🎯</div><h2>مستعد للتحدي؟</h2>
          <p style="margin:0;max-width:460px">30 سؤالاً: من كل درس سؤال، وأسئلة بأسلوب الامتحانات الدولية. في النهاية ستعرف نتيجتك في كل وحدة والدروس التي تحتاج مراجعة.</p>
          ${S.examBest != null ? `<p class="muted" style="margin:0">أفضل نتيجة لك: <b>${S.examBest}%</b></p>` : ''}
          <button class="btn primary" data-start>ابدأ الاختبار 🚀</button></div></div></div>`;
    $('[data-start]').addEventListener('click', start);
    function start() {
      const pool = shuffle(UNITS.flatMap(u => u.lessons.map(l => shuffle(tagged(u, l))[0])).concat(shuffle(EXAM_EXTRA).slice(0, 6).map(q => Object.assign({}, q, { tag: '🏅 أسلوب الامتحان', _u: 'x' }))));
      mountMCQ($('[data-stage]'), pool, { keepOrder: true, onEnd: (el, score, total, wrong) => {
        const pct = Math.round(score / total * 100);
        S.examBest = Math.max(S.examBest || 0, pct); save(); updateBar();
        const bars = UNITS.map(u => {
          const n = pool.filter(q => q._u === u.id).length, w = wrong.filter(q => q._u === u.id).length, p = n ? Math.round((n - w) / n * 100) : 0;
          return `<div class="ub" style="${colorVars(u)}"><span>${u.emoji} ${esc(u.ar)}</span><div class="progress"><i style="width:${p}%;background:var(--c)"></i></div><span>${p}%</span></div>`;
        }).join('');
        const cert = pct >= 80 ? `<div class="cert"><span style="font-size:40px">🏅</span><b>شهادة إنجاز</b><span class="cname">${esc(S.name || 'البطل')}</span><span>أنهى الاختبار النهائي لكتاب WOW! 7A بنتيجة ${pct}%</span></div>` : '';
        reviewEnd(el, score, total, wrong.filter(q => q._u !== 'x'), pageExam, `نتيجتك ${pct}%`, cert + `<div class="ubars">${bars}</div>`);
      }});
    }
  }

  /* ---------- router ---------- */
  function route() {
    const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    try { speechSynthesis.cancel(); } catch (e) {}
    if (p[0] === 'u' && unitById(p[1])) pageUnit(unitById(p[1]));
    else if (p[0] === 'l' && unitById(p[1])) {
      const u = unitById(p[1]), l = u.lessons.find(x => x.id === p[2]);
      if (l) pageLesson(u, l, ['learn', 'play', 'quiz'].includes(p[3]) ? p[3] : 'learn'); else pageUnit(u);
    } else if (p[0] === 't' && unitById(p[1])) pageUnitTest(unitById(p[1]));
    else if (p[0] === 'exam') pageExam();
    else pageHome();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  updateBar(); route();
})();
</script>
</body>
</html>
