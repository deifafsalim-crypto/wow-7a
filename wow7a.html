<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة WOW! للصف السابع – 7A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFF7EC; --bg2:#FDEFDC; --card:#FFFFFF; --ink:#34304A; --muted:#7D7893;
  --shell:rgba(52,48,74,.05); --line:rgba(52,48,74,.08);
  --mint:#D3F2E6; --mintD:#1E9A83;
  --peach:#FFE3D1; --peachD:#E8703F;
  --sky:#DAEEFC; --skyD:#3389D0;
  --lemon:#FFF3BF; --lemonD:#C99400;
  --lilac:#ECE3FC; --lilacD:#7657C7;
  --rose:#FFE0E7; --roseD:#D94873;
  --good:#23A57C; --bad:#E05A5A;
  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --shadow:0 18px 40px -22px rgba(80,60,40,.35), 0 2px 6px -2px rgba(80,60,40,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1D1A2B; --bg2:#242036; --card:#2B2741; --ink:#F4F0FF; --muted:#B3ADCB;
    --shell:rgba(255,255,255,.05); --line:rgba(255,255,255,.08);
    --mint:#1F3D38; --peach:#443027; --sky:#1F3448; --lemon:#40391E; --lilac:#332A4E; --rose:#44263A;
    --shadow:0 18px 40px -22px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1D1A2B; --bg2:#242036; --card:#2B2741; --ink:#F4F0FF; --muted:#B3ADCB;
  --shell:rgba(255,255,255,.05); --line:rgba(255,255,255,.08);
  --mint:#1F3D38; --peach:#443027; --sky:#1F3448; --lemon:#40391E; --lilac:#332A4E; --rose:#44263A;
  --shadow:0 18px 40px -22px rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo Bhaijaan 2",Tahoma,"Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.6;min-height:100dvh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(600px 400px at 90% -5%,var(--peach),transparent 70%),radial-gradient(500px 380px at -5% 30%,var(--mint),transparent 70%),radial-gradient(520px 420px at 80% 105%,var(--sky),transparent 70%);opacity:.8}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.en{direction:ltr;text-align:left;unicode-bidi:isolate}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 18px 80px}

/* nav island */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:center;padding-top:14px}
.nav-in{display:flex;align-items:center;gap:8px;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);outline:1px solid var(--line)}
.nav a,.nav button{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px;transition:transform .5s var(--ease),background .4s var(--ease)}
.nav a:hover,.nav button:hover{background:var(--shell)}
.nav a:active,.nav button:active{transform:scale(.96)}
.logo b{background:var(--peachD);color:#fff;border-radius:999px;padding:0 10px;font-size:14px}
.starpill{background:var(--lemon)!important}

/* bezel */
.bz{background:var(--shell);border-radius:30px;padding:6px;outline:1px solid var(--line)}
.bz>.core{background:var(--card);border-radius:24px;box-shadow:inset 0 1px 1px rgba(255,255,255,.4)}

.reveal{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.reveal.in{opacity:1;transform:none}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:center;padding:44px 0 28px}
.eyebrow{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;letter-spacing:.08em;background:var(--lilac);color:var(--lilacD)}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.1;margin:12px 0 10px;font-weight:800}
.hero h1 span{color:var(--peachD)}
.hero p{color:var(--muted);margin:0 0 18px;font-size:18px}
.owl{font-size:110px;line-height:1;display:inline-block;animation:bob 3.4s var(--ease) infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.hero-card .core{padding:22px;text-align:center}
.ring{--p:0;width:140px;height:140px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:conic-gradient(var(--mintD) calc(var(--p)*1%),var(--shell) 0)}
.ring>div{width:112px;height:112px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:26px}
.ring small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:-8px}

.btn{display:inline-flex;align-items:center;gap:10px;padding:10px 12px 10px 22px;border-radius:999px;font-weight:800;background:var(--ink);color:var(--bg);text-decoration:none;transition:transform .5s var(--ease)}
.btn .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);transition:transform .5s var(--spring)}
.btn:hover .ic{transform:translateX(-4px) scale(1.08)}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--card);color:var(--ink);outline:1px solid var(--line)}
.btn.soft .ic{background:var(--shell)}
.btn.good{background:var(--mintD);color:#fff}

/* bento */
.sec-title{display:flex;align-items:end;justify-content:space-between;margin:34px 0 14px}
.sec-title h2{margin:0;font-size:28px}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.ucard{grid-column:span 4;text-decoration:none;color:inherit;transition:transform .6s var(--ease)}
.ucard:hover{transform:translateY(-4px) rotate(-.4deg)}
.ucard.big{grid-column:span 8}
.ucard .core{padding:22px;height:100%;position:relative;overflow:hidden;min-height:190px;display:flex;flex-direction:column}
.ucard .emo{font-size:52px;line-height:1}
.ucard h3{margin:8px 0 0;font-size:24px}
.ucard .en{color:var(--muted);font-weight:600}
.ucard .meta{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--shell)}
.bar{height:8px;border-radius:9px;background:var(--shell);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;transform-origin:right;background:currentColor;border-radius:9px;transition:transform 1s var(--ease)}

.t-lemon .core{background:var(--lemon)} .t-lemon{color:var(--lemonD)}
.t-peach .core{background:var(--peach)} .t-peach{color:var(--peachD)}
.t-mint .core{background:var(--mint)} .t-mint{color:var(--mintD)}
.t-sky .core{background:var(--sky)} .t-sky{color:var(--skyD)}
.t-lilac .core{background:var(--lilac)} .t-lilac{color:var(--lilacD)}
.t-rose .core{background:var(--rose)} .t-rose{color:var(--roseD)}
.ucard h3,.ucard p{color:var(--ink)}

/* unit path */
.uhead{padding:34px 0 10px;display:flex;gap:18px;align-items:center}
.uhead .emo{font-size:70px}
.uhead h1{margin:0;font-size:clamp(30px,5vw,44px);line-height:1.1}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:18px;color:var(--muted);text-decoration:none;font-weight:700}
.path{display:flex;flex-direction:column;gap:18px;margin-top:22px;position:relative}
.node{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;width:min(560px,100%);transition:transform .6s var(--ease)}
.node:nth-child(odd){align-self:flex-start}
.node:nth-child(even){align-self:flex-end}
.node:hover{transform:scale(1.02)}
.bubble{flex:none;width:78px;height:78px;border-radius:28px;display:grid;place-items:center;font-size:36px;box-shadow:var(--shadow),inset 0 -6px 0 rgba(0,0,0,.08)}
.node .core{flex:1;padding:14px 18px}
.node h4{margin:0;font-size:19px}
.stars{letter-spacing:2px;font-size:15px}
.stars .off{opacity:.25;filter:grayscale(1)}

/* lesson */
.tabs{display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--shell);width:max-content;max-width:100%;margin:18px 0;overflow-x:auto}
.tabs button{padding:8px 18px;border-radius:999px;font-weight:800;white-space:nowrap;transition:background .5s var(--ease),transform .4s var(--ease)}
.tabs button.on{background:var(--card);box-shadow:var(--shadow)}
.langt{display:flex;gap:4px;margin-inline-start:auto}
.langt button{padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--shell)}
.langt button.on{background:var(--ink);color:var(--bg)}
body.l-ar .en-only{display:none} body.l-en .ar-only{display:none}

.blk{margin-bottom:16px}
.blk .core{padding:20px}
.blk h3{margin:0 0 10px;font-size:21px;display:flex;align-items:center;gap:8px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.duo>div{padding:14px 16px;border-radius:18px;background:var(--bg2)}
.duo .lbl{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em}
body.l-ar .duo,body.l-en .duo{grid-template-columns:1fr}
.formula{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr;margin:6px 0 4px}
.formula span{padding:6px 14px;border-radius:14px;font-weight:800;background:var(--sky)}
.formula span:nth-child(2n){background:var(--peach)}
.formula span.plus{background:none;padding:6px 0}
.exs{display:grid;gap:8px}
.ex{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:var(--bg2)}
.ex .en{flex:1;font-weight:700}
.ex .ar{color:var(--muted);font-size:15px}
.spk{flex:none;width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:16px;box-shadow:0 2px 8px -3px rgba(0,0,0,.2);transition:transform .4s var(--spring)}
.spk:active{transform:scale(.85)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vt{padding:14px 10px;border-radius:20px;background:var(--bg2);text-align:center;transition:transform .5s var(--spring)}
.vt:hover{transform:translateY(-3px) rotate(1deg)}
.vt .e{font-size:40px;line-height:1.1}
.vt .w{font-weight:800;direction:ltr}
.vt .a{font-size:14px;color:var(--muted)}
.tip{display:flex;gap:12px;padding:14px 16px;border-radius:18px;background:var(--lemon)}
.tip .e{font-size:28px}
.book{font-size:13px;font-weight:700;color:var(--muted)}

/* games */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gcard{text-align:start;transition:transform .6s var(--ease)}
.gcard:hover{transform:translateY(-4px)}
.gcard .core{padding:18px;min-height:150px;display:flex;flex-direction:column;gap:4px}
.gcard .e{font-size:40px}
.gcard b{font-size:19px}
.gcard small{color:var(--muted)}
.stage .core{padding:22px;min-height:340px}
.gtop{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.gprog{flex:1;height:12px;border-radius:9px;background:var(--shell);overflow:hidden}
.gprog i{display:block;height:100%;background:linear-gradient(90deg,var(--mintD),var(--skyD));transform-origin:right;transition:transform .7s var(--ease);border-radius:9px}
.qtext{font-size:22px;font-weight:800;line-height:1.4}
.qa{color:var(--muted);margin-top:4px}
.qhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:14px 16px;border-radius:18px;background:var(--bg2);font-weight:700;font-size:18px;text-align:left;direction:ltr;transition:transform .45s var(--spring),background .3s var(--ease);outline:2px solid transparent}
.opt:hover{transform:translateY(-2px)}
.opt.ok{background:#CFF3E3;outline-color:var(--good);color:#11563f}
.opt.no{background:#FBD9D9;outline-color:var(--bad);color:#7a2020;animation:shake .45s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:14px;min-height:10px}
.fbox{padding:12px 16px;border-radius:16px;display:flex;gap:10px;align-items:center;animation:pop .5s var(--spring)}
.fbox.g{background:#DDF6EC;color:#11563f}
.fbox.b{background:#FCE3E3;color:#7a2020}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.next{margin-top:14px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:1/1;border-radius:20px;perspective:600px}
.mc .in{position:relative;width:100%;height:100%;transition:transform .6s var(--ease);transform-style:preserve-3d}
.mc.f .in,.mc.m .in{transform:rotateY(180deg)}
.mc .fr,.mc .bk{position:absolute;inset:0;border-radius:20px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:6px;text-align:center;font-weight:800;font-size:15px;line-height:1.25}
.mc .fr{background:linear-gradient(135deg,var(--lilac),var(--sky));font-size:30px}
.mc .bk{background:var(--card);outline:2px solid var(--line);transform:rotateY(180deg)}
.mc.m .bk{background:#DDF6EC;outline-color:var(--good)}
.sortitem{margin:10px auto 22px;width:max-content;max-width:100%;padding:14px 24px;border-radius:22px;background:var(--lemon);font-size:22px;font-weight:800;direction:ltr;box-shadow:var(--shadow);animation:pop .5s var(--spring)}
.buckets{display:grid;gap:10px}
.bucket{padding:18px 14px;border-radius:22px;font-weight:800;font-size:18px;transition:transform .4s var(--spring)}
.bucket:active{transform:scale(.96)}
.bucket small{display:block;font-weight:600;font-size:13px;opacity:.75}
.bucket.hit{outline:3px solid var(--good)}
.bucket.miss{animation:shake .45s}
.ansline{min-height:64px;padding:10px;border-radius:20px;border:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;direction:ltr;align-items:center;margin-bottom:14px;background:var(--bg2)}
.pool{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;justify-content:center}
.tok{padding:8px 14px;border-radius:14px;background:var(--card);outline:2px solid var(--line);font-weight:800;font-size:17px;transition:transform .4s var(--spring)}
.tok:hover{transform:translateY(-2px)}
.tok.used{opacity:.25;pointer-events:none}
.pool.stack{flex-direction:column;align-items:stretch}
.bigemo{font-size:78px;text-align:center;line-height:1.1}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.letters .tok{min-width:46px;text-align:center;font-size:22px}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:ltr;margin:14px 0}
.slot{width:40px;height:48px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:22px;font-weight:800;border-bottom:3px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.result{text-align:center;padding:14px 0}
.result .big{font-size:84px;line-height:1}
.result h2{margin:6px 0;font-size:32px}
.result .stars{font-size:40px;letter-spacing:6px}
.review{text-align:start;margin-top:18px;display:grid;gap:8px}
.review .it{padding:10px 14px;border-radius:14px;background:var(--bg2);font-size:15px}
.review .it b{direction:ltr;display:block}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.foot{text-align:center;color:var(--muted);font-size:14px;margin-top:50px}

@media (max-width:768px){
  .hero{grid-template-columns:1fr;text-align:center;padding-top:26px}
  .bento{grid-template-columns:1fr}
  .ucard,.ucard.big{grid-column:span 1}
  .duo{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .node,.node:nth-child(odd),.node:nth-child(even){align-self:stretch}
  .nav a span.hide-m{display:none}
  .mem{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

  learn:[
   {t:"rule",h:"🧠 القاعدة",en:"We use the Present perfect to talk about something that started in the past and is still true now.\nhave / has + past participle (been, had, lived, seen).",ar:"نستخدم المضارع التام للحديث عن شيء بدأ في الماضي وما زال مستمرًا الآن.\nالتركيب: have / has + التصريف الثالث للفعل (been, had, lived, seen)."},
   {t:"formula",parts:["I / You / We / They","have ('ve)","+","been / had / lived"]},
   {t:"formula",parts:["He / She / It","has ('s)","+","been / had / lived"]},
   {t:"rule",h:"⏱️ since أم for؟",en:"since + a POINT in time: since lunchtime, since 6 o'clock, since April, since I was eight.\nfor + a PERIOD of time: for a long time, for ten years, for two days, for a week.",ar:"since + نقطة بداية في الزمن (منذ): منذ الغداء، منذ الساعة 6، منذ أبريل، منذ كنت في الثامنة.\nfor + مدة زمنية (لمدة): لمدة طويلة، لمدة عشر سنوات، لمدة يومين، لمدة أسبوع."},
   {t:"tip",ar:"سؤال سريع يساعدك: هل تستطيع أن تضع إصبعك على التاريخ في التقويم؟ إذا نعم ← since. إذا كانت مدة تُحسب ← for.",en:"Can you point to it on a calendar? Yes → since. Is it an amount of time? → for."},
   {t:"ex",h:"💬 أمثلة من حوار الدرس",items:[["Frank has had his costume for a long time.","فرانك يملك زيّه منذ مدة طويلة."],["He has been a puppeteer since he was eight.","هو محرّك دمى منذ كان في الثامنة."],["Majid's uncle has been a comedian for ten years.","عم ماجد ممثل كوميدي منذ عشر سنوات."],["He hasn't seen his show since he was five.","لم يرَ عرضه منذ كان في الخامسة."],["I've been ready since lunchtime!","أنا جاهز منذ وقت الغداء!"],["How long have you been a puppeteer?","منذ متى وأنت محرّك دمى؟"]]}

 {id:"u2b",emo:"🕵️",en:"Modals: must, may, might, could, can't",ar:"أفعال الاستنتاج",

   {t:"rule",h:"🕵️ كن محققًا!",en:"must → we are SURE something is true.\ncan't → we are SURE something is NOT true.\nmay / might / could → we are NOT SURE (maybe).",ar:"must ← متأكد أن الشيء صحيح (لا بد أنه).\ncan't ← متأكد أن الشيء غير صحيح (مستحيل أن يكون).\nmay / might / could ← لست متأكدًا (ربما)."},
   {t:"formula",parts:["It","must / may / might / could / can't","+","be / have"]},
   {t:"tip",ar:"بعد هذه الأفعال يأتي الفعل بدون to وبدون s: It must be… / It could have fur. ✔️ (وليس It must is ❌)",en:"After modals use the base verb: It must be… It could have fur."},
   {t:"ex",h:"💬 من حوار الدرس",items:[["It can't be a bear. Bears don't live here.","مستحيل أن يكون دبًا، الدببة لا تعيش هنا."],["It could be a bird. I can hear birds.","ربما يكون طائرًا، أسمع أصوات طيور."],["It can't be a snake. It doesn't have scales.","مستحيل أن يكون أفعى، ليس له حراشف."],["It has spines! It must be a hedgehog.","له أشواك! لا بد أنه قنفذ."],["It isn't moving. It may be scared.","إنه لا يتحرك، ربما هو خائف."]]}

 {id:"u2c",emo:"🦫",en:"Book Club: The platypus folk tale",ar:"نادي الكتاب: حكاية خلد الماء",
  learn:[
   {t:"rule",h:"📜 ما هي الحكاية الشعبية؟ (Folk tale)",en:"Folk tales are OLD stories. They teach important things.",ar:"الحكايات الشعبية قصص قديمة، وهدفها أن تعلّمنا أشياء مهمة (حِكمة)."},
   {t:"story",h:"📖 ملخّص الحكاية",en:"Long ago the animals were fighting to be the best group. The lions (fur, can run), the fish (swim and dive) and the birds (beaks, lay eggs) all asked the platypus to join them, because she has fur, swims, has a beak and lays eggs. But she can't bite, can't breathe underwater and can't fly. The next day she said: 'You are all special in different ways, and I am special in my own way, too.' Then she curled up and went to sleep.",ar:"قديمًا كانت الحيوانات تتشاجر لتكون أفضل مجموعة. الأسود (فرو وجري) والأسماك (سباحة وغوص) والطيور (مناقير وبيض) دعت كلها خلد الماء للانضمام إليها، لأن له فروًا ويسبح وله منقار ويبيض. لكنه لا يعضّ ولا يتنفس تحت الماء ولا يطير. في اليوم التالي قال: «كلكم مميزون بطرق مختلفة، وأنا مميز بطريقتي أيضًا». ثم التفّ ونام.",book:"Class Book ص 46–47"},
   {t:"tip",ar:"💡 العبرة: كل واحد منا مميز بطريقته، ولا نحتاج أن نكون مثل غيرنا.",en:"Everyone is special in their own way."}
  ],

 {id:"u2d",emo:"🐝",en:"Animal verbs & First conditional",ar:"أفعال الحيوانات والجملة الشرطية الأولى",
  learn:[
   {t:"vocab",h:"🐍 أفعال الحيوانات (12 فعلًا)",list:"averbs"},
   {t:"rule",h:"🧠 الجملة الشرطية الأولى (First conditional)",en:"We use it for something that might happen in the FUTURE.\nIf + Present simple, … will / won't + verb",ar:"نستخدمها للحديث عن شيء ممكن أن يحدث في المستقبل.\nIf + مضارع بسيط ، ثم will / won't + الفعل"},
   {t:"formula",parts:["If you come with us,","you'll be with the best animals."]},
   {t:"tip",ar:"❌ لا نضع will بعد If مباشرة! نقول If you join us ✔️ وليس If you will join us ❌",en:"No 'will' in the If part!"},
   {t:"ex",h:"💬 أمثلة",items:[["If you join us, you'll be in the best group.","إذا انضممت إلينا ستكون في أفضل مجموعة."],["If I join the lions, the birds won't be happy.","إذا انضممت للأسود فلن تكون الطيور سعيدة."],["If I don't join the fish, they'll be angry.","إذا لم أنضم للأسماك فستغضب."],["If we plant more flowers, more bees will come.","إذا زرعنا زهورًا أكثر ستأتي نحلات أكثر."]]}

 {id:"u2e",emo:"🇴🇲",en:"National animals & likes",ar:"الحيوانات الوطنية والتعبير عن الإعجاب",
  learn:[
   {t:"story",h:"🌍 حيوانات وطنية",en:"The Arabian oryx is the national animal of Oman. It has white fur and long horns, eats grass and acacia leaves, gets water from its food and lives in groups of 15–30.\nRing-tailed lemurs (Madagascar) communicate with their tails, loud noises and horrible smells.\nThe Komodo dragon (Indonesia) tastes the air with its tongue and has venom. It is the largest lizard in the world – some are three metres long!",ar:"المها العربي هو الحيوان الوطني لسلطنة عُمان. له فرو أبيض وقرون طويلة، يأكل العشب وأوراق السمر، ويحصل على الماء من طعامه، ويعيش في مجموعات من 15 إلى 30.\nالليمور حلقي الذيل (مدغشقر) يتواصل بذيله وأصوات عالية وروائح كريهة.\nتنين كومودو (إندونيسيا) يتذوّق الهواء بلسانه وفي فمه سم، وهو أكبر سحلية في العالم – بعضها طوله 3 أمتار!",book:"Class Book ص 50"},
   {t:"ex",h:"😍➡️😖 التعبير عمّا تحب وتكره",items:[["I'm crazy about sea animals.","أنا أعشق الحيوانات البحرية."],["I find ants really interesting.","أجد النمل ممتعًا جدًا."],["I quite like cats.","أحب القطط نوعًا ما."],["I don't mind spiders.","لا أمانع العناكب."],["I'm not keen on ants.","لست متحمسًا للنمل."],["I don't like sharks at all.","لا أحب أسماك القرش أبدًا."],["I can't stand them!","لا أطيقها!"]]},
   {t:"rule",h:"🔊 النطق: المقطع المشدّد",en:"We say one part of a word more strongly: DOLphin, giRAFFE, JELlyfish, goRILla, kangaROO, ALligator, koAla, ELephant.",ar:"نضغط على مقطع واحد في الكلمة بصوت أقوى: DOLphin, giRAFFE, JELlyfish, goRILla, kangaROO, ALligator, koAla, ELephant."}

 {id:"u2f",emo:"🐢",en:"Literacy: information texts",ar:"القراءة والكتابة: النص المعلوماتي",

   {t:"rule",h:"🦴 فقاريات ولا فقاريات",en:"Vertebrates have a backbone (fish, reptiles, mammals, birds). Invertebrates have no backbone (insects, spiders, snails, jellyfish).",ar:"الفقاريات لها عمود فقري (أسماك، زواحف، ثدييات، طيور). اللافقاريات ليس لها عمود فقري (حشرات، عناكب، حلزون، قناديل البحر)."},
   {t:"story",h:"📄 ملفات المعلومات (Fact files)",en:"Mata mata turtle: vertebrate reptile, lakes and rivers in South America, up to 45 cm and 15 kg, very long neck and nose – it breathes through its nose while hiding in water.\nGiant prickly stick insect: invertebrate, forests in Australia, eats leaves, up to 20 cm and 20 g – it looks like dead leaves or wood.\nHammerhead shark: fish, up to 6 m and 450 kg, babies are called pups, uses a sixth sense to find stingrays in the sand.",ar:"سلحفاة ماتا ماتا: زاحف فقاري، تعيش في بحيرات وأنهار أمريكا الجنوبية، طولها حتى 45 سم ووزنها حتى 15 كغ، لها رقبة وأنف طويلان جدًا وتتنفس من أنفها وهي مختبئة في الماء.\nحشرة العصا الشوكية العملاقة: لافقارية، في غابات أستراليا، تأكل الأوراق، طولها حتى 20 سم ووزنها 20 غرامًا، تشبه الأوراق الميتة أو الخشب.\nالقرش المطرقة: سمكة، طوله حتى 6 أمتار ووزنه 450 كغ، صغاره تسمى pups، ويستخدم حاسة سادسة ليجد اللخمة في الرمل.",book:"Class Book ص 54–55"},
   {t:"tip",ar:"✍️ عند كتابة نص معلوماتي: استخدم كل معلومات ملف الحقائق، واكتب جملًا كاملة، ولا تستخدم الاختصارات (اكتب centimetres بدل cm)، وأضف صفات.",en:"Use all the fact-file info, write full sentences, no abbreviations, add adjectives."}

   {t:"story",h:"📖 نصائح فرانك للسفر",en:"Remember your passport, ticket and money. Children need a new passport every five years. Put your name and address on your bag so you won't lose it. Take light clothes and flip-flops for sunny days, and a raincoat or umbrella for rainy days. Don't take guidebooks – they're heavy; download apps instead. Take a charger, and a pillow if you travel at night.",ar:"تذكّر جواز السفر والتذكرة والمال. الأطفال يحتاجون جوازًا جديدًا كل خمس سنوات. اكتب اسمك وعنوانك على حقيبتك كي لا تضيع. خذ ملابس خفيفة وشبشبًا للأيام المشمسة، ومعطف مطر أو مظلة للأيام الممطرة. لا تأخذ الأدلة السياحية لأنها ثقيلة، حمّل تطبيقات بدلًا منها. خذ الشاحن، ووسادة إذا سافرت ليلًا.",book:"Class Book ص 68"}

   {t:"story",h:"🌍 أرض مدهشة",en:"The Earth turns around every 24 hours – that's why we have day and night, and why time is different around the world: when it's 7 p.m. in Muscat, it's 11 a.m. in New York. The Earth goes around the Sun in 365 days (a year). In Europe, June, July and August are in summer. Australia has the opposite seasons!",ar:"الأرض تدور حول نفسها كل 24 ساعة، لذلك عندنا ليل ونهار، والوقت يختلف حول العالم: عندما تكون الساعة 7 مساءً في مسقط تكون 11 صباحًا في نيويورك. والأرض تدور حول الشمس في 365 يومًا (سنة). في أوروبا يونيو ويوليو وأغسطس صيف، وأستراليا عكسها تمامًا!",book:"Class Book ص 92"},

/* speech + sfx */
function say(t){try{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/_+/g," blank ").replace(/[•…]/g," "));u.lang="en-GB";u.rate=.88;const v=speechSynthesis.getVoices().find(v=>/en-GB/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
let AC;function tone(f,d=.12,t="sine",delay=0,vol=.12){if(!S.snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=vol;o.connect(g);g.connect(AC.destination);const s=AC.currentTime+delay;g.gain.setValueAtTime(vol,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
const sfx={ok(){tone(660,.1);tone(880,.16,"sine",.09)},no(){tone(220,.18,"triangle")},flip(){tone(520,.05,"triangle",0,.06)},win(){[523,659,784,1046].forEach((f,i)=>tone(f,.18,"sine",i*.1))}};

/* confetti */
const cv=$("#confetti"),cx=cv.getContext("2d");let parts=[];
function confetti(n=120){cv.width=innerWidth;cv.height=innerHeight;const cols=["#F2784B","#1E9A83","#3389D0","#C99400","#7657C7","#D94873"];for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-4,r:Math.random()*6+4,c:cols[i%6],a:Math.random()*6,life:0});if(parts.length===n)requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;p.life++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);cx.restore()});parts=parts.filter(p=>p.y<cv.height+20&&p.life<260);if(parts.length)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height)}

/* helpers */
function starsOf(id){return S.stars[id]||0}
function starStr(n,max=3){let s="";for(let i=0;i<max;i++)s+=i<n?"⭐":'<span class="off">⭐</span>';return `<span class="stars">${s}</span>`}
function totalStars(){return ALL.reduce((a,l)=>a+starsOf(l.id),0)}
function updPill(){$("#starpill").textContent="⭐ "+totalStars();$("#sndbtn").textContent=S.snd?"🔊":"🔇"}
function reveal(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll(".reveal").forEach((el,i)=>{el.style.transitionDelay=Math.min(i*60,400)+"ms";io.observe(el)})}
function setLang(l){S.lang=l;save();document.body.className="l-"+l;document.querySelectorAll(".langt button").forEach(b=>b.classList.toggle("on",b.dataset.l===l))}
$("#sndbtn").onclick=()=>{S.snd=!S.snd;save();updPill()};

/* MCQ engine */
function prepQ(q){if(q.noshuf||q.opts.length<3)return {...q};const ord=shuffle(q.opts.map((o,i)=>i));return {...q,opts:ord.map(i=>q.opts[i]),a:ord.indexOf(q.a)}}
function runMCQ(st,qs,done){
 qs=qs.map(prepQ);let i=0,sc=0;const rev=[];
 function show(){
  const q=qs[i];
  st.innerHTML=gtop(i,qs.length)+`<div class="qhead"><div class="qtext en">${esc(q.q)}</div><button class="spk">🔊</button></div>
   <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div><div class="fb"></div><div class="nx"></div>`;
  st.querySelector(".qhead .spk").onclick=()=>say(q.q);
  st.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   const k=+b.dataset.k,ok=k===q.a;st.querySelectorAll(".opt").forEach(x=>x.disabled=true);
   st.querySelector(`.opt[data-k="${q.a}"]`).classList.add("ok");
   if(ok){sc++;sfx.ok();fb(st,1,pr()+(q.w?" · "+esc(q.w):""))}else{b.classList.add("no");sfx.no();fb(st,0,`الإجابة الصحيحة: <b class="en" style="display:inline">${esc(q.opts[q.a])}</b>${q.w?"<br>"+esc(q.w):""}`);rev.push([q.q,q.opts[q.a]])}
   st.querySelector(".nx").innerHTML=`<button class="btn next">${i<qs.length-1?"التالي":"النتيجة"} <span class="ic">←</span></button>`;
   st.querySelector(".next").onclick=()=>{i++;i<qs.length?show():done(sc,qs.length,rev)};
  });
 }show();
}

/* Memory */
function gMemory(st,g,done){
 const words=shuffle(V[g.list]).slice(0,6);let cards=[];
 words.forEach((w,i)=>{cards.push({p:i,t:`<span class="en" style="text-align:center">${esc(w[0])}</span>`});cards.push({p:i,t:`<div><div style="font-size:30px">${w[2]}</div>${esc(w[1])}</div>`})});
 cards=shuffle(cards);let open=[],matched=0,moves=0,lock=false;
 st.innerHTML=`<div class="gtop"><b>🃏 طابق الكلمة الإنجليزية مع معناها</b><span class="chip" id="mv" style="margin-inline-start:auto">المحاولات: 0</span></div><div class="mem">${cards.map((c,i)=>`<button class="mc" data-i="${i}"><div class="in"><div class="fr">❓</div><div class="bk">${c.t}</div></div></button>`).join("")}</div>`;
 st.querySelectorAll(".mc").forEach(b=>b.onclick=()=>{
  if(lock||b.classList.contains("f")||b.classList.contains("m"))return;
  b.classList.add("f");sfx.flip();open.push(b);
  const c=cards[+b.dataset.i];if(/en/.test(c.t)&&c.t.indexOf("font-size:30px")<0)say(words[c.p][0]);
  if(open.length===2){moves++;st.querySelector("#mv").textContent="المحاولات: "+moves;const[a,b2]=open;
   if(cards[+a.dataset.i].p===cards[+b2.dataset.i].p){a.classList.add("m");b2.classList.add("m");open=[];matched++;sfx.ok();if(matched===words.length)setTimeout(()=>done(Math.max(words.length*2-(moves-words.length),Math.ceil(words.length*1.2)),words.length*2),600)}
   else{lock=true;setTimeout(()=>{a.classList.remove("f");b2.classList.remove("f");open=[];lock=false},900)}}
 });
}
/* Listen */
function gListen(st,g,done){
 const list=V[g.list],rounds=shuffle(list).slice(0,6);let i=0,sc=0;const rev=[];
 function show(){
  const w=rounds[i],opts=shuffle([w,...shuffle(list.filter(x=>x!==w)).slice(0,3)]);
  st.innerHTML=gtop(i,rounds.length)+`<div style="text-align:center"><button class="btn" id="play" style="font-size:22px">اضغط واستمع 🔊 <span class="ic">▶</span></button><p style="color:var(--muted)">اختر الصورة الصحيحة للكلمة التي تسمعها</p></div>
  <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}" style="text-align:center;direction:rtl"><div style="font-size:40px">${o[2]}</div>${esc(o[1])}</button>`).join("")}</div><div class="fb"></div><div class="nx"></div>`;
  st.querySelector("#play").onclick=()=>say(w[0]);setTimeout(()=>say(w[0]),350);
  st.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   const o=opts[+b.dataset.k],ok=o===w;st.querySelectorAll(".opt").forEach(x=>x.disabled=true);
   st.querySelector(`.opt[data-k="${opts.indexOf(w)}"]`).classList.add("ok");
   if(ok){sc++;sfx.ok();fb(st,1,`${pr()} <b class="en" style="display:inline">${esc(w[0])}</b>`)}else{b.classList.add("no");sfx.no();fb(st,0,`الكلمة كانت <b class="en" style="display:inline">${esc(w[0])}</b> = ${esc(w[1])}`);rev.push([w[0],w[1]])}
   st.querySelector(".nx").innerHTML=`<button class="btn next">${i<rounds.length-1?"التالي":"النتيجة"} <span class="ic">←</span></button>`;
   st.querySelector(".next").onclick=()=>{i++;i<rounds.length?show():done(sc,rounds.length,rev)};
  });
 }show();
}
/* Spell */
function gSpell(st,g,done){
 const pool=V[g.list].filter(w=>/^[A-Za-z]+$/.test(w[0])&&w[0].length<=11);const rounds=shuffle(pool).slice(0,5);let i=0,sc=0;const rev=[];
 function show(){
  const w=rounds[i],word=w[0].toLowerCase(),letters=shuffle(word.split("").map((c,k)=>({c,k})));let typed=[],miss=false;
  const draw=()=>{
   st.innerHTML=gtop(i,rounds.length)+`<div class="bigemo">${w[2]}</div><div style="text-align:center;color:var(--muted);font-weight:700">${esc(w[1])} <button class="spk" style="display:inline-grid;vertical-align:middle" id="sp">🔊</button></div>
   <div class="slots">${word.split("").map((c,k)=>`<div class="slot">${typed[k]?typed[k].c:""}</div>`).join("")}</div>
   <div class="letters">${letters.map((o,k)=>`<button class="tok ${typed.includes(o)?"used":""}" data-k="${k}">${o.c}</button>`).join("")}</div>
   <div class="row"><button class="btn soft" id="undo">↩️ تراجع</button><button class="btn soft" id="hint">💡 تلميح</button></div><div class="fb"></div><div class="nx"></div>`;
   st.querySelector("#sp").onclick=()=>say(w[0]);
   st.querySelector("#undo").onclick=()=>{typed.pop();draw()};
   st.querySelector("#hint").onclick=()=>{miss=true;say(w[0]);const f=st.querySelector(".fb");f.innerHTML=`<div class="fbox g">💡 أول حرف: <b class="en" style="display:inline">${word[0].toUpperCase()}</b> · عدد الحروف: ${word.length}</div>`};
   st.querySelectorAll(".letters .tok").forEach(b=>b.onclick=()=>{sfx.flip();typed.push(letters[+b.dataset.k]);
    if(typed.length===word.length){const ans=typed.map(t=>t.c).join("");draw();st.querySelectorAll(".letters .tok,#undo,#hint").forEach(x=>x.disabled=true);
     if(ans===word){if(!miss)sc++;sfx.ok();fb(st,1,pr()+` <b class="en" style="display:inline">${esc(w[0])}</b>`);say(w[0])}else{sfx.no();fb(st,0,`التهجئة الصحيحة: <b class="en" style="display:inline">${esc(word)}</b>`);rev.push([word,w[1]])}
     st.querySelector(".nx").innerHTML=`<button class="btn next">${i<rounds.length-1?"التالي":"النتيجة"} <span class="ic">←</span></button>`;
     st.querySelector(".next").onclick=()=>{i++;i<rounds.length?show():done(sc,rounds.length,rev)};
    }else draw()});
  };draw();
 }show();
}
/* Sort */
function gSort(st,g,done){
 const items=shuffle(g.items);let i=0,sc=0;const rev=[];
 const tones=["peach","mint","sky","lilac"];
 function show(){
  const it=items[i];
  st.innerHTML=gtop(i,items.length)+`<p style="text-align:center;color:var(--muted);margin:0">ضع البطاقة في المكان الصحيح 👇</p><div class="sortitem">${esc(it[0])}</div>
  <div class="buckets" style="grid-template-columns:repeat(${Math.min(g.buckets.length,3)},1fr)">${g.buckets.map((b,k)=>`<button class="bucket" data-k="${k}" style="background:var(--${tones[k]})"><span class="en" style="text-align:center">${esc(b[0])}</span><small>${esc(b[1])}</small></button>`).join("")}</div><div class="fb"></div><div class="nx"></div>`;
  st.querySelectorAll(".bucket").forEach(b=>b.onclick=()=>{
   const k=+b.dataset.k,ok=k===it[1];st.querySelectorAll(".bucket").forEach(x=>x.disabled=true);
   st.querySelector(`.bucket[data-k="${it[1]}"]`).classList.add("hit");
   if(ok){sc++;sfx.ok();fb(st,1,pr());setTimeout(nextQ,700)}else{b.classList.add("miss");sfx.no();fb(st,0,`مكانها الصحيح: <b class="en" style="display:inline">${esc(g.buckets[it[1]][0])}</b>`);rev.push([it[0],g.buckets[it[1]][0]]);
    st.querySelector(".nx").innerHTML=`<button class="btn next">التالي <span class="ic">←</span></button>`;st.querySelector(".next").onclick=nextQ}
  });
 }
 function nextQ(){i++;i<items.length?show():done(sc,items.length,rev)}
 show();
}
/* Build & Order share engine */
function gBuild(st,g,done){wordEngine(st,g.items.map(s=>s.split(" ")),done,false)}
function gOrder(st,g,done){wordEngine(st,g.items,done,true)}
function wordEngine(st,sets,done,stack){
 sets=shuffle(sets).slice(0,5);let i=0,sc=0;const rev=[];
 function show(){
  const target=sets[i];let pool=shuffle(target.map((t,k)=>({t,k})));if(pool.every((p,k)=>p.k===k)&&pool.length>1)pool=pool.reverse();let ans=[];
  const draw=()=>{
   st.innerHTML=gtop(i,sets.length)+`<p style="text-align:center;color:var(--muted);margin:0 0 10px">${stack?"اضغط على البطاقات بالترتيب الصحيح (من الأول للأخير)":"اضغط على الكلمات لتكوين جملة صحيحة"}</p>
   <div class="ansline ${stack?"pool stack":""}" style="${stack?"flex-direction:column;align-items:stretch":""}">${ans.map((a,k)=>`<button class="tok" data-a="${k}">${stack?(k+1)+". ":""}${esc(a.t)}</button>`).join("")||'<span style="color:var(--muted);margin:auto">…</span>'}</div>
   <div class="pool ${stack?"stack":""}">${pool.map((p,k)=>`<button class="tok ${ans.includes(p)?"used":""}" data-p="${k}">${esc(p.t)}</button>`).join("")}</div>
   <div class="row"><button class="btn good" id="chk" ${ans.length<target.length?"disabled style='opacity:.4'":""}>تحقّق ✔️ <span class="ic">←</span></button></div><div class="fb"></div><div class="nx"></div>`;
   st.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{sfx.flip();ans.push(pool[+b.dataset.p]);if(!stack&&ans.length===1)say(ans[0].t);draw()});
   st.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ans.splice(+b.dataset.a,1);draw()});
   st.querySelector("#chk").onclick=()=>{
    const ok=ans.map(a=>a.t).join("|")===target.join("|");st.querySelectorAll(".tok,#chk").forEach(x=>x.disabled=true);
    if(ok){sc++;sfx.ok();fb(st,1,pr());if(!stack)say(target.join(" "))}else{sfx.no();fb(st,0,`الترتيب الصحيح:<br><b class="en">${esc(target.join(stack?" → ":" "))}</b>`);rev.push([target.join(stack?" → ":" "),""])}
    st.querySelector(".nx").innerHTML=`<button class="btn next">${i<sets.length-1?"التالي":"النتيجة"} <span class="ic">←</span></button>`;
    st.querySelector(".next").onclick=()=>{i++;i<sets.length?show():done(sc,sets.length,rev)};
   };
  };draw();
 }show();
}

/* Result */
function result(st,s,t,o){
 const r=s/t,stars=r>=.9?3:r>=.7?2:r>=.5?1:0;
 const face=stars===3?"🏆":stars===2?"🥳":stars===1?"🙂":"💪";
 const msg=stars===3?"ممتاز جدًا! أنت نجم ⭐":stars===2?"رائع! قريب جدًا من العلامة الكاملة":stars===1?"جيد! جرّب مرة أخرى لتحصل على نجوم أكثر":"لا بأس، راجع الشرح وحاول مرة أخرى 💪";
 if(o.saveId&&stars>starsOf(o.saveId)){S.stars[o.saveId]=stars;save();updPill()}
 if(stars>=2){sfx.win();confetti()}
 st.innerHTML=`<div class="result"><div class="big">${face}</div><h2 dir="ltr">${s} / ${t}</h2>${starStr(stars)}<p style="font-size:19px;font-weight:700">${msg}</p>
  <div class="row"><button class="btn" id="ag">إعادة 🔁 <span class="ic">↻</span></button><button class="btn soft" id="bk">${o.backLabel||"رجوع للألعاب"} <span class="ic">←</span></button></div>
  ${o.review&&o.review.length?`<div class="review"><b>📝 راجع هذه الإجابات:</b>${o.review.map(x=>`<div class="it"><b>${esc(x[0])}</b>${x[1]?"✅ "+esc(x[1]):""}</div>`).join("")}</div>`:""}</div>`;
 st.querySelector("#ag").onclick=o.again;st.querySelector("#bk").onclick=o.back;
}

/* Quiz */
function renderQuizIntro(el,l){
 el.innerHTML=`<div class="bz stage reveal"><div class="core" style="text-align:center">
  <div class="bigemo">✅</div><h2 style="margin:6px 0">اختبار: ${l.ar}</h2>
  <p style="color:var(--muted)">${l.quiz.length} أسئلة من تمارين الكتاب · احصل على 90% لتربح 3 نجوم ⭐⭐⭐</p>
  <div style="margin-bottom:14px">أفضل نتيجة لك: ${starStr(starsOf(l.id))}</div>
  <button class="btn" id="go">ابدأ الاختبار <span class="ic">←</span></button></div></div>`;
 $("#go").onclick=()=>startQuiz(el,l);reveal();
}
function startQuiz(el,l){
 const st=stage(el);
 runMCQ(st,l.quiz,(s,t,rev)=>result(st,s,t,{saveId:l.id,again:()=>startQuiz(el,l),back:()=>location.hash="#/unit/"+l.unit.id,backLabel:"رجوع للوحدة",review:rev}));
}

/* Final exam */
function examView(){
 app.innerHTML=`<a class="back" href="#/">→ الرئيسية</a>
 <div class="uhead reveal"><div class="emo">🏆</div><div><span class="eyebrow">FINAL EXAM · 7A</span><h1>الاختبار النهائي</h1><div style="color:var(--muted)">30 سؤالًا عشوائيًا من كل الوحدات · كل مرة أسئلة مختلفة!</div></div></div>
 <div id="pane"></div>`;
 const pane=$("#pane");
 pane.innerHTML=`<div class="bz stage reveal"><div class="core">
  <h3 style="margin-top:0">📋 تعليمات الاختبار</h3>
  <div class="exs">
   <div class="ex">📚 أسئلة من: الترحيب، الوحدة 1، الوحدة 2، الوحدة 3، ونادي التعلّم.</div>
   <div class="ex">🧠 قواعد + مفردات + قراءة + تمارين الامتحان (A2 Flyers / Key).</div>
   <div class="ex">🔊 اضغط على السمّاعة لتسمع السؤال بالإنجليزي.</div>
   <div class="ex">🎯 النتيجة 80% أو أكثر = أنت جاهز للاختبار الحقيقي!</div>
  </div>
  <div class="row" style="justify-content:flex-start;margin-top:18px"><button class="btn" id="go">ابدأ الاختبار النهائي <span class="ic">←</span></button>
  ${S.exam!=null?`<span class="chip" style="align-self:center">🥇 أفضل نتيجة: ${S.exam}%</span>`:""}</div>
  <h3>📊 جاهزيتك حسب الوحدة</h3>
  <div class="exs">${UNITS.map(u=>{const g=u.lessons.reduce((a,l)=>a+starsOf(l.id),0),m=u.lessons.length*3;return `<div class="ex t-${u.tone}"><span style="font-size:24px">${u.emo}</span><div style="flex:1;color:var(--ink)"><b>${u.ar}</b><div class="bar"><i style="transform:scaleX(${g/m})"></i></div></div><b style="color:var(--ink)">${g}/${m}⭐</b></div>`}).join("")}</div>
 </div></div>`;
 $("#go").onclick=()=>startExam(pane);reveal();
}
function startExam(pane){
 const per={w:3,u1:8,u2:8,u3:8,lc:3},qs=[];
 UNITS.forEach(u=>{const pool=u.lessons.flatMap(l=>l.quiz);qs.push(...shuffle(pool).slice(0,per[u.id]))});
 const st=stage(pane);
 runMCQ(st,shuffle(qs),(s,t,rev)=>{
  const pc=Math.round(s/t*100);if(S.exam==null||pc>S.exam){S.exam=pc;save()}
  result(st,s,t,{again:()=>startExam(pane),back:()=>location.hash="#/",backLabel:"الرئيسية",review:rev});
  const h=st.querySelector("h2");h.insertAdjacentHTML("afterend",`<div class="chip" style="font-size:18px;margin:4px 0">${pc}% · ${pc>=80?"جاهز للاختبار الحقيقي! 🎓":"راجع الدروس ذات النجوم القليلة ثم حاول مجددًا 📚"}</div>`);
 });
}

/* Router */
function route(){
 updPill();const h=location.hash.replace(/^#\/?/,"").split("/");
 window.scrollTo({top:0});
 if(h[0]==="unit")unitView(h[1]);
 else if(h[0]==="lesson")lessonView(h[1],h[2]||"learn");
 else if(h[0]==="exam")examView();
 else home();
}
addEventListener("hashchange",route);
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=()=>{};
setLang(S.lang);route();
</script>
